# The server settings of the Postgres baseline: the one source of every setting.
#
# scripts/pg-server.sh passes each line to the server as a -c flag, and
# pgengine.CheckSettings refuses a server whose SHOW value for any name here differs
# from the value written here, so a value is written the way the server prints it
# (4GB, not 4096MB). A line is name = value; # starts a comment.
#
# This is the regime in which counters are taken: checkpoints out of the way (a
# checkpoint every day, and the harness issues CHECKPOINT before a measured section)
# and autovacuum off, with the writer running VACUUM on its own schedule. The regime
# in which time is measured (15 minute checkpoints, autovacuum on) is a second file,
# written when timings are.
#
# Not here, because it depends on where the server runs and not on what it is asked
# to do: listen_addresses (pg-server.sh sets it: loopback inside the container for a
# local server, none for a Unix socket on CI).

# Memory. A quarter of a 16 GB runner is shared_buffers; effective_cache_size also
# fixes how a GiST index is built.
shared_buffers = 4GB
effective_cache_size = 10GB
work_mem = 64MB
maintenance_work_mem = 1GB

# One backend per query: point reads gain nothing from workers, and index builds are
# the same on every run.
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
jit = off

# An SSD.
random_page_cost = 1.1
effective_io_concurrency = 200

# Commits are not synced, as the spike's engines are not; the data is still crash
# safe, because fsync and full_page_writes stay on.
synchronous_commit = off
fsync = on
full_page_writes = on

# The least WAL Postgres can write, which is generous to it: toposhift replicates
# nothing either. Provisional: max_wal_size is fitted to the first CI run's disk and
# fixed before the registration.
wal_level = minimal
max_wal_senders = 0
wal_compression = lz4
max_wal_size = 4GB
min_wal_size = 1GB
wal_buffers = 64MB
checkpoint_timeout = 1d

autovacuum = off

# The plan that is explained is the plan that runs.
plan_cache_mode = force_custom_plan
default_statistics_target = 100
