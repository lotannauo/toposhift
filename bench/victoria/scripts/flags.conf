# The server flags of the metrics-store baseline: the one source of every flag.
#
# scripts/vm-server.sh passes each line to the server as -name=value, and
# vmengine.CheckFlags refuses a server whose /flags value for any name here differs from
# the value written here, so a value is written the way the server prints it (1h, not
# 3600s). A line is name = value; # starts a comment.
#
# Registered before any data, with no tuning budget after: a flag is changed only by a
# new version of the registration, never to make a number better.
#
# Not here, because it depends on where the server runs and not on what it is asked to
# do: the data directory and the listen address (vm-server.sh sets them: the server
# listens on all interfaces of its container, and the container's port is published on
# the loopback of the host only).

# Samples start in 2026 (the synthetic streams) and in 2022 (the Alibaba trace), and
# nothing may fall outside the retention: the longest period the server accepts.
retentionPeriod = 100y

# The lookback of a query that names no window of its own is bounded by the sparsest
# producer's window (an hour). The planned queries all name their producers' windows
# and do not depend on it.
search.maxStalenessInterval = 1h

# Exactly one sample is written per producer interval, so dropping the near duplicates
# of a series would only hide a fault of the converter.
dedup.minScrapeInterval = 0s

# The queries ask the past; the offset only matters near the present.
search.latencyOffset = 0s

# Limits raised past anything a planned query reaches, so that a refusal by a default
# limit is never taken for a measurement.
search.maxUniqueTimeseries = 10000000
search.maxSamplesPerQuery = 1000000000
search.maxPointsPerTimeseries = 1000000
