name: dolt

# The Dolt baseline (bench/dolt) is a module of its own, and none of the four ci
# shards runs its tasks: a baseline that will need a database server must never
# hold up a pull request that touches nothing under bench/dolt. This workflow runs
# the module's format check, lint, vulnerability scan, tests and race-detector
# tests on both architectures. It is not a required check and it times nothing. The
# steps that start a server come with the engine that needs one. A pull request
# runs only when it changes bench/dolt or this file, so one that changes
# internal/** or bench/spike/** is caught only after it reaches main, which is
# acceptable for a baseline that is not a required check.

on:
  pull_request:
    paths:
      - "bench/dolt/**"
      - ".github/workflows/dolt.yml"
  push:
    branches: [main]
    paths:
      - "bench/dolt/**"
      # What the module links and checks its answers against.
      - "bench/spike/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "bench/go.mod"
      - "bench/go.sum"
      - ".github/workflows/dolt.yml"

permissions: {}

concurrency:
  # As in ci.yml: a newer push to a pull request cancels its older run; runs on
  # main are never cancelled.
  group: dolt-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit, so that a pipe that fails fails the step (the default shell for
    # an unnamed bash step does not set pipefail).
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in ci.yml: go test reuses a result only when the files a test read
      # look unchanged, and checkout gives every file the current time.
      - name: Give checked-out files times derived from their content
        run: python3 .github/scripts/stable-mtimes.py

      - name: Install pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          cache: false

      - name: Check formatting
        run: mise run bench:dolt:fmt:check

      - name: Lint
        run: mise run bench:dolt:lint

      - name: Scan the Go dependencies for known vulnerabilities
        run: mise run bench:dolt:vuln

      - name: Test
        run: mise run bench:dolt:test

      - name: Test with the race detector
        run: mise run bench:dolt:test:race

      - name: Keep the inputs that failed a property
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapid-failures-dolt-${{ matrix.os }}
          path: "bench/dolt/**/testdata/rapid/**"
          if-no-files-found: ignore
          retention-days: 14
