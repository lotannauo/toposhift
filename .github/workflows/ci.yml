name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and arm64; arm64 is the Oracle A1 production target.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          cache: true

      # The Go build and module caches, so the race-instrumented Pebble build, the
      # linters and govulncheck do not start cold on every run. The Go build cache is
      # content-addressed (an entry is looked up by a hash of its inputs), so a stale
      # or foreign entry is never used for different code; the key follows the
      # dependencies, and a partial hit still restores what is unchanged.
      - name: Cache Go builds and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Run the same tasks as local development
        run: mise run ci

  # After every push to main, install the pushed commit exactly the way a user
  # would: `go install pkg@version`. That form ignores the checkout's go.mod and
  # refuses any module whose go.mod has replace or exclude directives. The
  # checkout is only there so mise can read mise.toml and use the pinned Go.
  install:
    name: go install @sha
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out (for mise.toml only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Go only
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          install_args: go
          # Off so this go-only install never shares a cache entry with the
          # ci job, which installs every tool.
          cache: false

      - name: Install the pushed commit and check its version
        env:
          # Fetch this module straight from GitHub and skip the checksum
          # database for it, since both can lag a fresh merge. Dependencies
          # still come through the proxy and are still checksum-verified.
          GOPRIVATE: github.com/lotannauo/toposhift
        run: |
          export GOBIN="${RUNNER_TEMP}/bin"
          go install "github.com/lotannauo/toposhift/cmd/toposhift@${SHA}"

          version="$("${GOBIN}/toposhift" version)"
          echo "installed: ${version}"
          short="${SHA:0:12}"
          case "${version}" in
            "toposhift v"*"-${short}") ;;  # pseudo-version of this exact commit
            "toposhift v"*-*|*devel*)
              echo "expected the pseudo-version for ${short}, got: ${version}" >&2
              exit 1 ;;
            "toposhift v"*) ;;             # a release tag that points at this commit
            *)
              echo "unexpected version output: ${version}" >&2
              exit 1 ;;
          esac

          "${GOBIN}/toposhift" help >/dev/null
