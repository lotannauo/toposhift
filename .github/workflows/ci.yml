name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on main: the deep run, with new random workloads and new schedules of
  # the concurrency checks, and the vulnerability scans against that day's
  # database. The shards run too, from the caches the last push to main saved.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # A newer push to a pull request cancels its older run; runs on main are never
  # cancelled. The event is in the group so the nightly run neither waits behind
  # a push to main nor replaces one that is waiting.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What the Go cache holds: the Go build and module caches and the linter's
  # cache. actions/cache versions an entry by this list, so an entry saved with
  # one list is never restored with another: every cache step uses this one.
  GO_CACHE_PATHS: |
    ~/.cache/go-build
    ~/go/pkg/mod
    ~/.cache/golangci-lint

jobs:
  # mise run ci is three shards (see mise.toml), and each runs here as its own job
  # on each architecture. These names must not start with "ci (": those are the
  # required checks, which the ci job below reports for all the shards together.
  shard:
    name: ${{ matrix.shard }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and arm64; arm64 is the Oracle A1 production target.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # check:ci-shards reads this line and fails unless it lists exactly the
        # shards mise run ci depends on.
        shard: [static, bench, race]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history for static, where gitleaks scans it; the last
          # commit elsewhere. (Written this way round because 0 is false in an
          # expression: "static && 0 || 1" would always give 1.)
          fetch-depth: ${{ matrix.shard != 'static' && 1 || 0 }}
          persist-credentials: false

      # Not cached: the tools install in about 4 s, and a cached copy took about
      # 160 MB of the repository's 10 GB of cache per architecture for every edit
      # of mise.toml.
      - name: Install pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          cache: false

      # Each shard keeps its own entry, so the instrumented Pebble builds, the
      # linters and govulncheck do not start cold on every run, and go test can
      # reuse the result of a package that has not changed. The Go build cache is
      # content-addressed (an entry is looked up by a hash of its inputs), so a
      # stale or foreign entry is never used for different code. A pull request
      # only restores: the newest entry of this shard for the same dependencies,
      # else the newest of any shard (the modules at least are the same), else the
      # newest for this platform. A push to main saves a new entry named by its
      # commit, because an exact key that already exists is never saved again and
      # the cache would stop following the code.
      - name: Restore Go builds and modules
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/go.sum') }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/go.sum') }}-${{ matrix.shard }}-
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/go.sum') }}-
            go-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Run the shard, as local development does
        env:
          SHARD: ${{ matrix.shard }}
          TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          # Nightly, every test runs again instead of reusing an earlier result,
          # so the random workloads get new seeds even when nothing changed.
          GOFLAGS: ${{ github.event_name == 'schedule' && '-count=1' || '' }}
        run: |
          mkdir -p "$TEST_REPORT_DIR"
          if [ "$SHARD" = race ]; then
            # Evidence for a killed run: one line a minute while the tests run,
            # and a full snapshot if this step is signalled. Neither can change
            # the step's result.
            # shellcheck disable=SC2329 # called from the trap below
            snapshot() {
              echo "::group::runner state ($1)"
              date -u +%FT%TZ || true; uptime || true
              free -m || true
              df -h / "$RUNNER_TEMP" || true
              ps -eo pid,ppid,etimes,stat,rss,comm --sort=-rss | head -n 15 || true
              sudo -n dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -n 20 || true
              echo "::endgroup::"
            }
            sample() {
              while sleep 60 >/dev/null 2>&1; do
                echo "[sampler] $(date -u +%T) load=$(cut -d' ' -f1 /proc/loadavg) $(free -m | awk '/^Mem:/{print "mem_avail_mb="$7} /^Swap:/{print "swap_used_mb="$3}' | tr '\n' ' ')root_avail=$(df -h --output=avail / | tail -n 1 | tr -d ' ')" || true
              done
            }
            sample & sampler=$!
            mise run "ci:${SHARD}" & tests=$!
            trap 'snapshot "signal received"; kill -TERM "$tests" 2>/dev/null || true; wait "$tests" || true; kill "$sampler" 2>/dev/null || true; exit 143' INT TERM
            status=0
            wait "$tests" || status=$?
            kill "$sampler" 2>/dev/null || true
            exit "$status"
          else
            mise run "ci:${SHARD}"
          fi

      - name: Show the runner's state
        if: ${{ always() && matrix.shard == 'race' }}
        continue-on-error: true
        run: |
          {
            echo "### Runner state at the end"
            echo '```'
            uptime || true
            free -m || true
            df -h / || true
            echo "kernel OOM or killed-process lines: $(sudo -n dmesg 2>/dev/null | grep -ciE 'oom|killed process' || true)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          sudo -n dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -n 20 || true
          ps -eo pid,etimes,rss,comm --sort=-rss | head -n 10 || true

      # What was slow, from the test reports the run wrote, so a test that grows
      # shows up in the job summary before the job as a whole does. It runs
      # whatever happened, and a report a kill left truncated must not turn the
      # job red or hide the real failure.
      - name: Report the slowest tests
        if: ${{ always() }}
        continue-on-error: true
        env:
          TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
        run: |
          # The list goes to a file and is cut afterwards: the runner's shell stops
          # on a failed pipe, and head closing the pipe would fail this step.
          slowest="$RUNNER_TEMP/slowest.txt"
          for report in "$TEST_REPORT_DIR"/*.json; do
            [ -e "$report" ] || continue
            mise exec -- gotestsum tool slowest --jsonfile "$report" --threshold 3s > "$slowest"
            {
              echo "### Slowest tests: $(basename "$report" .json)"
              echo '```'
              head -n 15 "$slowest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # rapid writes the inputs that made a property fail under testdata/rapid; a
      # failure on a runner is otherwise one nobody can replay.
      - name: Keep the inputs that failed a property
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapid-failures-${{ matrix.shard }}-${{ matrix.os }}
          path: "**/testdata/rapid/**"
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Go builds and modules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # The required checks, ci (ubuntu-24.04) and ci (ubuntu-24.04-arm): each passes
  # only when every shard passed. A skipped required check counts as passing, so
  # this runs whatever happened to the shards (always(), which also runs it when
  # the run is cancelled) and fails unless their result is success: a shard that
  # failed, was cancelled, timed out or was skipped fails it. A matrix job has one
  # result for all of its legs, so a shard failing on one architecture fails both
  # checks. It only reads that result, so it runs on x86-64 for both names.
  ci:
    name: ci (${{ matrix.os }})
    if: always()
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check that every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "the shards finished with result '${RESULT}', not success" >&2
            exit 1
          fi
          echo "every shard passed"

  # The whole of every test under the race detector, in random order and never
  # reused from an earlier run, after every push to main and nightly. A pull
  # request runs the race detector on the part of the tests that starts goroutines
  # and everything else with Pebble's invariant checks on (mise run ci). This is
  # not a required check: it reports a race the day it is merged, not before. It
  # builds what the race shard builds (-short changes what a test does, not the
  # build), so it starts from that shard's cache.
  deep:
    name: deep (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          cache: false

      - name: Restore Go builds and modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/go.sum') }}-race-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/go.sum') }}-race-
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/go.sum') }}-
            go-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Run every test under the race detector
        env:
          TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
        run: |
          mkdir -p "$TEST_REPORT_DIR"
          # Evidence for a killed run: one line a minute while the tests run, and
          # a full snapshot if this step is signalled. Neither can change the
          # step's result.
          # shellcheck disable=SC2329 # called from the trap below
          snapshot() {
            echo "::group::runner state ($1)"
            date -u +%FT%TZ || true; uptime || true
            free -m || true
            df -h / "$RUNNER_TEMP" || true
            ps -eo pid,ppid,etimes,stat,rss,comm --sort=-rss | head -n 15 || true
            sudo -n dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -n 20 || true
            echo "::endgroup::"
          }
          sample() {
            while sleep 60 >/dev/null 2>&1; do
              echo "[sampler] $(date -u +%T) load=$(cut -d' ' -f1 /proc/loadavg) $(free -m | awk '/^Mem:/{print "mem_avail_mb="$7} /^Swap:/{print "swap_used_mb="$3}' | tr '\n' ' ')root_avail=$(df -h --output=avail / | tail -n 1 | tr -d ' ')" || true
            done
          }
          sample & sampler=$!
          mise run ci:deep & tests=$!
          trap 'snapshot "signal received"; kill -TERM "$tests" 2>/dev/null || true; wait "$tests" || true; kill "$sampler" 2>/dev/null || true; exit 143' INT TERM
          status=0
          wait "$tests" || status=$?
          kill "$sampler" 2>/dev/null || true
          exit "$status"

      - name: Show the runner's state
        if: ${{ always() }}
        continue-on-error: true
        run: |
          {
            echo "### Runner state at the end"
            echo '```'
            uptime || true
            free -m || true
            df -h / || true
            echo "kernel OOM or killed-process lines: $(sudo -n dmesg 2>/dev/null | grep -ciE 'oom|killed process' || true)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          sudo -n dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -n 20 || true
          ps -eo pid,etimes,rss,comm --sort=-rss | head -n 10 || true

      - name: Report the slowest tests
        if: ${{ always() }}
        continue-on-error: true
        env:
          TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
        run: |
          # As in the shards: to a file first, then cut.
          slowest="$RUNNER_TEMP/slowest.txt"
          for report in "$TEST_REPORT_DIR"/*.json; do
            [ -e "$report" ] || continue
            mise exec -- gotestsum tool slowest --jsonfile "$report" --threshold 3s > "$slowest"
            {
              echo "### Slowest tests: $(basename "$report" .json)"
              echo '```'
              head -n 15 "$slowest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep the inputs that failed a property
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapid-failures-deep-${{ matrix.os }}
          path: "**/testdata/rapid/**"
          if-no-files-found: ignore
          retention-days: 14

  # After every push to main, install the pushed commit exactly the way a user
  # would: `go install pkg@version`. That form ignores the checkout's go.mod and
  # refuses any module whose go.mod has replace or exclude directives. The
  # checkout is only there so mise can read mise.toml and use the pinned Go.
  install:
    name: go install @sha
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out (for mise.toml only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Go only
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          install_args: go
          cache: false

      - name: Install the pushed commit and check its version
        env:
          # Fetch this module straight from GitHub and skip the checksum
          # database for it, since both can lag a fresh merge. Dependencies
          # still come through the proxy and are still checksum-verified.
          GOPRIVATE: github.com/lotannauo/toposhift
          # Install the way the documented install builds: without cgo. The
          # runner has a C compiler, and Pebble would otherwise compile in its
          # optional cgo zstd, which the store does not use.
          CGO_ENABLED: "0"
        run: |
          export GOBIN="${RUNNER_TEMP}/bin"
          go install "github.com/lotannauo/toposhift/cmd/toposhift@${SHA}"

          version="$("${GOBIN}/toposhift" version)"
          echo "installed: ${version}"
          short="${SHA:0:12}"
          case "${version}" in
            "toposhift v"*"-${short}") ;;  # pseudo-version of this exact commit
            "toposhift v"*-*|*devel*)
              echo "expected the pseudo-version for ${short}, got: ${version}" >&2
              exit 1 ;;
            "toposhift v"*) ;;             # a release tag that points at this commit
            *)
              echo "unexpected version output: ${version}" >&2
              exit 1 ;;
          esac

          "${GOBIN}/toposhift" help >/dev/null
