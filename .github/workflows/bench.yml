name: bench

# The storage-engine spike's timing gates (G2: the longest retention stalls
# ingest no longer than 60 s; G3: the 99th percentile of a batch's commit time and
# the first batch after each retention are within 2x of the best candidate) are
# only meaningful on CI hardware, so they are measured here, on GitHub-hosted
# runners. Each spikebench build writes its timings and its table bytes per record
# (G4) into the candidate's manifest.json; this workflow only produces those
# manifests and uploads them. They are judged offline, later.
#
# Standard GitHub-hosted runners are free for a public repository, so the work is
# cut into one job per (runner, window, candidate, repetition): the longest job is
# then one 30-day build, well inside the six hours a job may run. Larger runners
# cost money and are not used.
#
# Layout L on RocksDB (the RL/ and RL4/ candidates, bench/rocksdb) is built and read
# by rocksbench, with cgo, against the RocksDB library rocksdb.yml builds and caches
# from main. A dispatch's library job restores that library once per architecture,
# under rocksdb.yml's key and path, or builds it with the same script when the cache
# has lost it, and hands it to the build jobs as an artifact of the run. Nothing here
# saves a cache: rocksdb.yml on main stays the library's one writer. So every RocksDB
# build of one run on one architecture links one library, no timed job spends its time
# compiling it, and a push to main that evicts cache entries while a dispatch runs
# changes nothing in that dispatch: the plans, too, reach the build jobs as an
# artifact of the run, which the cache's eviction does not touch. With the read input,
# repetition 1 of every candidate also reads its build afterwards, for the answers
# and counters that rocksbench judge, the RocksDB rule's judge, compares between the
# engines; the build alone is timed.
#
# A dispatch waits at its setup job for approval: that job runs in the environment
# bench-approval, which a maintainer creates beforehand (Settings, Environments) with
# the maintainer as the required reviewer and "prevent self-review" off. The
# environment must exist first: GitHub creates a missing one on first use, with no
# reviewer, and the run then starts unapproved. Nothing else of a run starts until
# its setup job has been approved.

on:
  workflow_dispatch:
    inputs:
      family:
        description: The scenario family, which fixes the scenario flags of the plans.
        type: choice
        options: [rmae, ph5m-rmae]
        default: rmae
      windows:
        description: Windows to build, in days, as a comma list of at most 4 increasing integers from 1 to 31.
        type: string
        default: "2,7,30"
      candidates:
        description: Candidates to build, as a comma list (for example L/off,L/k64a2l1ns,M/crdb1).
        type: string
        default: L/off,L/k64a2l1ns
      reps:
        description: Repetitions of every build, an integer from 1 to 10.
        type: string
        default: "1"
      arches:
        description: Which runners to build on.
        type: choice
        options: [both, x64, arm64]
        default: both
      pins_window:
        description: The window, in days, whose stream the pinned prefixes are chosen from, an integer from 1 to 60.
        type: string
        default: "2"
      sync:
        description: Pass -sync to every build. Needs the change that adds that flag; before it merges the build step fails at once with "flag provided but not defined".
        type: boolean
        default: false
      metrics_every:
        description: Pass -metrics-every with this Go duration (for example 30s) to every build, or leave empty. Needs the change that adds that flag; before it merges the build step fails at once with "flag provided but not defined".
        type: string
        default: ""
      go_mem_limit:
        description: Run every build with this Go memory limit (GOMEMLIMIT), as a whole number of MiB or GiB such as 11GiB, or leave empty for none. Never applied to the plans. Builds with different limits are never compared.
        type: string
        default: ""
      max_parallel:
        description: How many build jobs may run at once (1 to 20). The free plan runs 20 jobs at once across the account; the default leaves 9 for pull-request CI.
        type: string
        default: "11"
      retention_mode:
        description: "How the root store's retention runs in the Lroot builds. background is an arm of the store gate: one window of 7 or 30 days, Lroot candidates only, sync true, metrics sampled, expected_sha named, and the builds paced at 4500 records/s."
        type: choice
        options: [sync, background]
        default: sync
      retain_flush_dels:
        description: The retention flush threshold of the Lroot builds, a rung of the registered ladder, or the store's default. A rung needs retention_mode background.
        type: choice
        options: [default, "32768", "24576", "16384"]
        default: default
      expected_sha:
        description: The 40-hexadecimal-digit commit the dispatch must run (the tag's or main's). Required for background; when left empty for sync, the run's own commit.
        type: string
        default: ""
      read:
        description: After the build of repetition 1 of each candidate, read it (spikebench read, or rocksbench read for RL/ and RL4/) and keep its results.json. Required for a dispatch of both engines.
        type: boolean
        default: false
  # A change to this workflow or to the program it runs gets a dry run at the
  # tiny preset, which proves the whole chain in minutes.
  pull_request:
    paths:
      - .github/workflows/bench.yml
      - bench/**
      - mise.toml
      # It names the RocksDB library as rocksdb.yml does, which the dry run checks.
      - .github/workflows/rocksdb.yml

permissions: {}

concurrency:
  # A newer push to a pull request cancels its older dry run. A dispatch has a
  # group of its own and is never cancelled: a timed run that is cancelled has
  # measured nothing.
  group: bench-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit, so that a pipe that fails fails the step (the default shell for
    # an unnamed bash step does not set pipefail).
    shell: bash

jobs:
  # Turns the inputs into a matrix. Every input reaches a script only through env,
  # and is checked here before anything else runs, so a mistyped dispatch fails in
  # seconds and not after hours of building.
  setup:
    name: bench setup
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Approval: see the top of this file.
    environment: bench-approval
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      family: ${{ steps.matrix.outputs.family }}
      family_flags: ${{ steps.matrix.outputs.family_flags }}
      windows: ${{ steps.matrix.outputs.windows }}
      pins_window: ${{ steps.matrix.outputs.pins_window }}
      sync: ${{ steps.matrix.outputs.sync }}
      metrics_every: ${{ steps.matrix.outputs.metrics_every }}
      go_mem_limit: ${{ steps.matrix.outputs.go_mem_limit }}
      pebble_memory_limit: ${{ steps.matrix.outputs.pebble_memory_limit }}
      read: ${{ steps.matrix.outputs.read }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      retention_mode: ${{ steps.matrix.outputs.retention_mode }}
      pace: ${{ steps.matrix.outputs.pace }}
      retain_flush_dels: ${{ steps.matrix.outputs.retain_flush_dels }}
      expected_sha: ${{ steps.matrix.outputs.expected_sha }}
      rocksdb_oses: ${{ steps.matrix.outputs.rocksdb_oses }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The whole history, so that the check can see that a tag's commit is on main.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The setup runs the checks of the commit it gates, as the plans and the builds
      # check theirs.
      - name: Check the commit
        env:
          SHA: ${{ github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::the checkout is not the run's commit" >&2; exit 1; }

      # The checks are in a tracked script, which a test runs on every pull request
      # with each input it must refuse. Timed runs come from main, or from a tag
      # gate-freeze-YYYYMMDD on main that freezes one commit for a series of
      # dispatches; the tag carries this file too. Every job checks that it runs the
      # commit the dispatch names. The ref check is a convention, not enforcement: a
      # dispatch with --ref <branch> runs that branch's copy of this file, which can
      # skip it. The enforcement is offline: spikebench storegate -commit refuses a
      # manifest whose revision is not the frozen commit, and the timing judge, given
      # -git, refuses one whose revision is not an ancestor of main.
      - name: Check the inputs and plan the jobs
        id: matrix
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          FAMILY: ${{ inputs.family }}
          WINDOWS: ${{ inputs.windows }}
          CANDIDATES: ${{ inputs.candidates }}
          REPS: ${{ inputs.reps }}
          ARCHES: ${{ inputs.arches }}
          PINS_WINDOW: ${{ inputs.pins_window }}
          SYNC: ${{ inputs.sync }}
          METRICS_EVERY: ${{ inputs.metrics_every }}
          GO_MEM_LIMIT: ${{ inputs.go_mem_limit }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          RETENTION_MODE: ${{ inputs.retention_mode }}
          RETAIN_FLUSH_DELS: ${{ inputs.retain_flush_dels }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          READ: ${{ inputs.read }}
        run: bash bench/scripts/gate-dispatch-check.sh

  # Makes the plans once. A 30-day plan takes about 8.5 to 12.5 GB of memory to make
  # but the file is about 350 KB, so it is made here, where the memory is, and the
  # build jobs on both architectures download it: the artifact this job keeps, which
  # the judge reads too, so a build reads the very bytes that are kept. The plan is expected
  # to be the same file on any machine; the digests printed in the summary check
  # it, and a later check compares them with the plans made locally.
  plans:
    name: bench plans
    if: github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the commit
        env:
          EXPECTED_SHA: ${{ needs.setup.outputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::the checkout is not the commit the dispatch expects" >&2
            exit 1
          fi

      - name: Install pinned Go
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          install_args: go
          cache: false

      # time -v is how each step's peak memory is read.
      - name: Check that GNU time is present
        run: |
          if [ ! -x /usr/bin/time ]; then
            sudo apt-get update && sudo apt-get install --yes time
          fi
          /usr/bin/time --version

      # A timed build refuses a binary from a tree with uncommitted or untracked
      # changes, and the plans are made by the same binary the builds use. The
      # check is the last thing before go build, and the binary and everything
      # after it are written outside the checkout.
      - name: Build spikebench
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the checkout has uncommitted or untracked changes, so a timed build would refuse the binary:" >&2
            git status --porcelain >&2
            exit 1
          fi
          cd bench
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/spikebench" ./cmd/spikebench

      - name: Make the pins and the plans
        env:
          # From the setup job's fixed mapping of the family, never from free
          # text; it is split into words on purpose.
          FAMILY_FLAGS: ${{ needs.setup.outputs.family_flags }}
          PINS_WINDOW: ${{ needs.setup.outputs.pins_window }}
          WINDOWS: ${{ needs.setup.outputs.windows }}
        run: |
          set -euo pipefail
          SB="$RUNNER_TEMP/spikebench"
          PLANS="$RUNNER_TEMP/plans"
          LOGS="$RUNNER_TEMP/logs"
          mkdir -p "$LOGS"
          read -ra flags <<<"$FAMILY_FLAGS"
          IFS=, read -ra wins <<<"$WINDOWS"

          /usr/bin/time -v -o "$LOGS/pins.time.txt" \
            "$SB" pins -out "$PLANS" -preset ci "${flags[@]}" -window "$PINS_WINDOW" \
            2>&1 | tee "$LOGS/pins.log"

          for d in "${wins[@]}"; do
            /usr/bin/time -v -o "$LOGS/plan-R$d.time.txt" \
              "$SB" plan -out "$PLANS/R$d" -preset ci "${flags[@]}" -window "$d" -pins "$PLANS/pins.json" -full \
              2>&1 | tee "$LOGS/plan-R$d.log"
          done

      - name: Summarise the plans
        if: always()
        env:
          WINDOWS: ${{ needs.setup.outputs.windows }}
        run: |
          set -uo pipefail
          PLANS="$RUNNER_TEMP/plans"
          LOGS="$RUNNER_TEMP/logs"
          IFS=, read -ra wins <<<"$WINDOWS"
          peak() {
            awk -F': ' '/Maximum resident set size/ { printf "%.0f MiB", $2 / 1024 }' "$1" 2>/dev/null
          }
          {
            echo "### Plans"
            echo
            echo "| file | sha256 | peak memory of the step that made it |"
            echo "|---|---|---|"
            if [ -f "$PLANS/pins.json" ]; then
              echo "| pins.json | \`$(sha256sum "$PLANS/pins.json" | cut -d' ' -f1)\` | $(peak "$LOGS/pins.time.txt") |"
            else
              echo "| pins.json | not written | |"
            fi
            for d in "${wins[@]}"; do
              if [ -f "$PLANS/R$d/plan.json" ]; then
                echo "| R$d/plan.json | \`$(sha256sum "$PLANS/R$d/plan.json" | cut -d' ' -f1)\` | $(peak "$LOGS/plan-R$d.time.txt") |"
              else
                echo "| R$d/plan.json | not written | |"
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"

      # The build jobs download this artifact by its name, so the name is fixed.
      - name: Keep the plans and their logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-plans-${{ needs.setup.outputs.family }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plans
            ${{ runner.temp }}/logs
          if-no-files-found: warn
          # A re-run of this job in the same run replaces the artifact.
          overwrite: true
          retention-days: 90

  # The RocksDB library of the run, once per architecture that builds a RocksDB
  # candidate: restored from rocksdb.yml's cache, or, when the cache has lost it,
  # built here by the same script (minutes), and kept as an artifact of the run for
  # the build jobs. It saves no cache. On a pull request it runs for x86-64 only,
  # for the RocksDB dry run, from the pull request's own script. The name must not
  # start with "ci (".
  rocksdb-library:
    name: bench RocksDB library (${{ matrix.os }})
    needs: setup
    if: >-
      !cancelled() && (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && needs.setup.result == 'success' && needs.setup.outputs.rocksdb_oses != '[]'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Never an empty list, which a matrix refuses: x86-64 alone on a pull request,
        # and for a dispatch whose setup gave none (the job is then skipped anyway).
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && needs.setup.outputs.rocksdb_oses != '[]' && needs.setup.outputs.rocksdb_oses || '["ubuntu-24.04"]') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A dispatch's library is built by the script of the commit the dispatch names.
      - name: Check the commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ needs.setup.outputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::the checkout is not the commit the dispatch expects" >&2
            exit 1
          fi

      # The library's key and path, exactly as rocksdb.yml names them (the dry run
      # checks that the workflows agree).
      - name: Name the RocksDB build
        id: rocks
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          script=bench/rocksdb/scripts/build-rocksdb.sh
          version="$("$script" --version)"
          hash="$(sha256sum "$script" | cut -d' ' -f1)"
          {
            echo "key=rocksdb-v1-${OS_LABEL}-${RUNNER_ARCH}-${version}-${hash}"
            echo "prefix=${RUNNER_TEMP}/rocksdb-${version}-${hash:0:16}"
          } >> "$GITHUB_OUTPUT"

      # Only restored, never saved here. Restored first, so that a hit installs
      # nothing.
      - name: Restore the RocksDB build
        id: rockscache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.rocks.outputs.prefix }}
          key: ${{ steps.rocks.outputs.key }}

      # Only for a build: as in rocksdb.yml, the compiler, Ubuntu's cmake and the
      # compression libraries.
      - name: Install the compiler and the libraries RocksDB links
        if: steps.rockscache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev
          dpkg-query --show build-essential cmake liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev g++

      - name: Build RocksDB
        if: steps.rockscache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        env:
          CMAKE: /usr/bin/cmake
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          echo "::warning::no RocksDB library is cached under this key, so this run builds its own; rocksdb.yml on main saves the cached one"
          bench/rocksdb/scripts/build-rocksdb.sh "$ROCKSDB_PREFIX"

      - name: Show how the library was built
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          cat "$ROCKSDB_PREFIX/lib/rocksdb-build.stamp"
          ls -l "$ROCKSDB_PREFIX/lib/librocksdb.a"

      # One tar file, so that the layout and the modes are kept as they are, and a
      # file that says whether the cache had the library.
      - name: Pack the library
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
          CACHE_HIT: ${{ steps.rockscache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rocksdb-artifact"
          mkdir -p "$out"
          tar -C "$(dirname "$ROCKSDB_PREFIX")" -cf "$out/rocksdb.tar" "$(basename "$ROCKSDB_PREFIX")"
          if [ "$CACHE_HIT" = true ]; then echo true; else echo false; fi >"$out/cache-hit"
          (cd "$out" && sha256sum rocksdb.tar) | tee "$out/rocksdb.tar.sha256"
          echo "- RocksDB library for ${RUNNER_ARCH}: restored from the cache: $(cat "$out/cache-hit"); tar sha256 \`$(cut -d' ' -f1 "$out/rocksdb.tar.sha256")\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the library for the build jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-rocksdb-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rocksdb-artifact
          if-no-files-found: error
          overwrite: true
          # As long as the build artifacts, so that a re-run of a failed build job
          # finds it.
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}

  # One build per job, by spikebench or, for RL/ and RL4/, by rocksbench, so the
  # longest job is one 30-day build and, with the read input, its read. Every job
  # gets its own runner, and so its own disk and its own memory.
  build:
    name: "bench build (${{ matrix.os }} R${{ matrix.window }} ${{ matrix.candidate }} rep ${{ matrix.rep }})"
    # The library job is skipped for a dispatch with no RocksDB candidate, and a
    # job whose needs were skipped is skipped too unless its condition says otherwise.
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' &&
      needs.setup.result == 'success' && needs.plans.result == 'success' &&
      (needs.rocksdb-library.result == 'success' || needs.rocksdb-library.result == 'skipped')
    needs: [setup, plans, rocksdb-library]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 358
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The free plan runs 20 jobs at once across the account, so the builds
      # leave the rest for pull-request CI. Checked in the setup job.
      max-parallel: ${{ fromJSON(needs.setup.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The runner images carry gigabytes of toolchains a build never uses, and the
      # database of a long build is large. Best effort: a path that is not on this
      # image is skipped, and nothing under the home directory is touched.
      - name: Free disk space
        run: |
          echo "before:"
          df -h /
          df -h /mnt || true
          df -h "$RUNNER_TEMP"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          echo "after:"
          df -h /
          df -h /mnt || true
          df -h "$RUNNER_TEMP"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the commit
        env:
          EXPECTED_SHA: ${{ needs.setup.outputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::the checkout is not the commit the dispatch expects" >&2
            exit 1
          fi

      - name: Install pinned Go
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          install_args: go
          cache: false

      # The plans job's artifact of this run, which holds plans/ and logs/; only
      # this run's artifacts can be named here (no run-id, no token).
      - name: Fetch the plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-plans-${{ needs.setup.outputs.family }}-${{ github.run_id }}
          path: ${{ runner.temp }}/planset

      # time -v is how the build's peak memory and elapsed time are read.
      - name: Check that GNU time is present
        run: |
          if [ ! -x /usr/bin/time ]; then
            sudo apt-get update && sudo apt-get install --yes time
          fi
          /usr/bin/time --version

      # As in rocksdb.yml, from Ubuntu's own archive: the compiler cgo needs, and the
      # compression libraries the RocksDB library links (named by
      # bench/rocksdb/scripts/cgoenv.sh). The versions are recorded in job.json.
      - name: Install the compiler and the libraries RocksDB links
        if: matrix.engine == 'rocksdb'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev
          dpkg-query --show build-essential cmake liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev g++

      # The library's key and path, exactly as rocksdb.yml names them: a cache's
      # path is part of its identity, so a path that differs by a byte misses even
      # under the same key. The dry run checks that the two workflows agree.
      - name: Name the RocksDB build
        if: matrix.engine == 'rocksdb'
        id: rocks
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          script=bench/rocksdb/scripts/build-rocksdb.sh
          version="$("$script" --version)"
          hash="$(sha256sum "$script" | cut -d' ' -f1)"
          {
            echo "key=rocksdb-v1-${OS_LABEL}-${RUNNER_ARCH}-${version}-${hash}"
            echo "prefix=${RUNNER_TEMP}/rocksdb-${version}-${hash:0:16}"
          } >> "$GITHUB_OUTPUT"

      # The library job's library of this run, never the cache: every RocksDB build
      # of the run on this architecture links the same one, whatever the cache holds
      # by now.
      - name: Fetch the RocksDB build
        if: matrix.engine == 'rocksdb'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-rocksdb-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rocksdb-artifact

      # Unpacked at the path the library job built or restored it at, which is this
      # job's too, and checked as a build is. cache-hit is what job.json records: true
      # when the library job restored it from rocksdb.yml's cache, false when it built it.
      - name: Unpack the RocksDB build
        if: matrix.engine == 'rocksdb'
        id: rockscache
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/rocksdb-artifact"
          (cd "$in" && sha256sum --check rocksdb.tar.sha256)
          top="$(tar -tf "$in/rocksdb.tar" | cut -d/ -f1 | sort -u)"
          if [ "$top" != "$(basename "$ROCKSDB_PREFIX")" ]; then
            echo "::error::the library artifact holds $top, not $(basename "$ROCKSDB_PREFIX")" >&2
            exit 1
          fi
          tar -C "$(dirname "$ROCKSDB_PREFIX")" --no-same-owner -xf "$in/rocksdb.tar"
          bench/rocksdb/scripts/build-rocksdb.sh --check-library "$ROCKSDB_PREFIX/lib/librocksdb.a"
          hit="$(cat "$in/cache-hit")"
          case "$hit" in
            true | false) echo "cache-hit=$hit" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::the library artifact's cache-hit is '$hit'" >&2; exit 1 ;;
          esac

      - name: Show how the library was built
        if: matrix.engine == 'rocksdb'
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          cat "$ROCKSDB_PREFIX/lib/rocksdb-build.stamp"
          ls -l "$ROCKSDB_PREFIX/lib/librocksdb.a"

      # A timed build refuses a binary from a tree with uncommitted or untracked
      # changes. The check is the last thing before go build, and the binary and
      # everything after it are written outside the checkout.
      - name: Build spikebench
        if: matrix.engine == 'pebble'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the checkout has uncommitted or untracked changes, so a timed build would refuse the binary:" >&2
            git status --porcelain >&2
            exit 1
          fi
          cd bench
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/spikebench" ./cmd/spikebench

      # The same check, then a build with cgo against the restored library, with the
      # module's tags. Not -trimpath: with it, go leaves CGO_LDFLAGS out of the
      # binary's build settings, and the engine finds its library's build stamp,
      # which the rule requires and a timed build refuses to run without, by the -L
      # directory recorded there. The paths the binary then records are the
      # runner's, alike on every job of one image.
      - name: Build rocksbench
        if: matrix.engine == 'rocksdb'
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the checkout has uncommitted or untracked changes, so a timed build would refuse the binary:" >&2
            git status --porcelain >&2
            exit 1
          fi
          cd bench/rocksdb
          ./scripts/cgoenv.sh go build -tags grocksdb_no_link,pebblegozstd -o "$RUNNER_TEMP/rocksbench" ./cmd/rocksbench

      # A build wants plan.json in its output directory, and nothing else there but
      # other candidates.
      - name: Prepare the build directory
        env:
          WINDOW: ${{ matrix.window }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/bench/R$WINDOW"
          mkdir -p "$WORK" "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/planset/plans/R$WINDOW/plan.json" "$WORK/plan.json"
          sha256sum "$WORK/plan.json"

      # What the disk and the memory did over the build, a minute apart. The build
      # directory is kept under the runner's temp directory for now, which is on
      # the root filesystem; every sample also reads /mnt, so that the pilot shows
      # which of the two disks is the one that fills up. If it shows that the root
      # filesystem is short, the fallback is a build directory under /mnt. The
      # sampler is not stopped here: the runner cleans up the processes a job left
      # behind when the job ends. One failed df or free must not end it, so
      # nothing in it can fail the loop.
      - name: Sample the disk and the memory
        run: |
          set -euo pipefail
          sample() {
            {
              date -u +%Y-%m-%dT%H:%M:%SZ
              echo "== root"
              df -kP / || true
              echo "== mnt"
              df -kP /mnt || true
              echo "== work"
              df -kP "$RUNNER_TEMP" || true
              free -m || true
            } >>"$RUNNER_TEMP/logs/system.log" 2>&1
          }
          sample
          (
            set +e
            while sleep 60; do sample; done
          ) >/dev/null 2>&1 &

      # Timed: no -untimed, no -rest-after-retention and no -canonical-layout, so
      # the numbers are those of a build as it ingests. Its own step with a timeout
      # shorter than the job's, so that an overrun still reaches the upload; shorter
      # still when a read follows it, which has a timeout of its own.
      - name: Build the candidate
        timeout-minutes: ${{ needs.setup.outputs.read == 'true' && matrix.rep == 1 && 280 || 340 }}
        env:
          WINDOW: ${{ matrix.window }}
          CANDIDATE: ${{ matrix.candidate }}
          ENGINE: ${{ matrix.engine }}
          SYNC: ${{ needs.setup.outputs.sync }}
          METRICS_EVERY: ${{ needs.setup.outputs.metrics_every }}
          GO_MEM_LIMIT: ${{ needs.setup.outputs.go_mem_limit }}
          PEBBLE_MEMORY_LIMIT: ${{ needs.setup.outputs.pebble_memory_limit }}
          RETENTION_MODE: ${{ needs.setup.outputs.retention_mode }}
          PACE: ${{ needs.setup.outputs.pace }}
          RETAIN_FLUSH_DELS: ${{ needs.setup.outputs.retain_flush_dels }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/bench/R$WINDOW"
          if [ "$ENGINE" = rocksdb ]; then
            # rocksbench has the synchronous retention only and samples no metrics
            # (the setup refuses a dispatch that asks for either). Its Go memory
            # limit is not GOMEMLIMIT but the Pebble builds' limit, in bytes or
            # none, less the plan's cache and four memtables, which RocksDB holds
            # outside the Go heap; the manifest records the limit it ran under.
            bin="$RUNNER_TEMP/rocksbench"
            extra=(-pebble-memory-limit "$PEBBLE_MEMORY_LIMIT")
          else
            bin="$RUNNER_TEMP/spikebench"
            extra=(-retention-mode "$RETENTION_MODE")
            if [ -n "$METRICS_EVERY" ]; then
              extra+=(-metrics-every "$METRICS_EVERY")
            fi
            # The pace follows from the retention mode (0 for sync), and the
            # threshold is passed only when the dispatch named a rung.
            if [ "$PACE" != 0 ]; then
              extra+=(-pace "$PACE")
            fi
            if [ "$RETAIN_FLUSH_DELS" != default ]; then
              extra+=(-retain-flush-dels "$RETAIN_FLUSH_DELS")
            fi
            # Explicit, so that an empty input leaves the variable unset.
            if [ -n "$GO_MEM_LIMIT" ]; then
              export GOMEMLIMIT="$GO_MEM_LIMIT"
            fi
          fi
          if [ "$SYNC" = true ]; then
            extra+=(-sync)
          fi
          /usr/bin/time -v -o "$RUNNER_TEMP/logs/time.txt" \
            "$bin" build -out "$WORK" -candidate "$CANDIDATE" "${extra[@]}" \
            2>&1 | tee "$RUNNER_TEMP/logs/build.log"

      # Untimed, after the build: the queries of the plan, for the answers and the
      # counters of repetition 1 (never -perf, which makes every query that loads a
      # block unstable). spikebench reads under the GOMEMLIMIT its build had;
      # rocksbench's read takes no limit and runs with none. Its peak memory goes
      # to a file of its own, so time.txt stays the build's.
      - name: Read the candidate
        if: needs.setup.outputs.read == 'true' && matrix.rep == 1
        timeout-minutes: 60
        env:
          WINDOW: ${{ matrix.window }}
          CANDIDATE: ${{ matrix.candidate }}
          ENGINE: ${{ matrix.engine }}
          GO_MEM_LIMIT: ${{ needs.setup.outputs.go_mem_limit }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/bench/R$WINDOW"
          if [ "$ENGINE" = rocksdb ]; then
            bin="$RUNNER_TEMP/rocksbench"
          else
            bin="$RUNNER_TEMP/spikebench"
            if [ -n "$GO_MEM_LIMIT" ]; then
              export GOMEMLIMIT="$GO_MEM_LIMIT"
            fi
          fi
          /usr/bin/time -v -o "$RUNNER_TEMP/logs/read.time.txt" \
            "$bin" read -out "$WORK" -candidate "$CANDIDATE" \
            2>&1 | tee "$RUNNER_TEMP/logs/read.log"

      - name: Collect the manifest and the logs
        if: always()
        env:
          ENGINE: ${{ matrix.engine }}
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
          ROCKSDB_CACHE_KEY: ${{ steps.rocks.outputs.key }}
          ROCKSDB_CACHE_HIT: ${{ steps.rockscache.outputs.cache-hit }}
          FAMILY: ${{ needs.setup.outputs.family }}
          PINS_WINDOW: ${{ needs.setup.outputs.pins_window }}
          SYNC: ${{ needs.setup.outputs.sync }}
          METRICS_EVERY: ${{ needs.setup.outputs.metrics_every }}
          GO_MEM_LIMIT: ${{ needs.setup.outputs.go_mem_limit }}
          RETENTION_MODE: ${{ needs.setup.outputs.retention_mode }}
          PACE: ${{ needs.setup.outputs.pace }}
          RETAIN_FLUSH_DELS: ${{ needs.setup.outputs.retain_flush_dels }}
          REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ needs.setup.outputs.expected_sha }}
          OS: ${{ matrix.os }}
          WINDOW: ${{ matrix.window }}
          CANDIDATE: ${{ matrix.candidate }}
          SLUG: ${{ matrix.slug }}
          REP: ${{ matrix.rep }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # The runner's shell is bash -e -o pipefail (shell: bash), and a job may
          # leave any of the files read below unwritten: a repetition without a
          # read has no read.time.txt, and a job that failed or was cancelled
          # before its build has no binary, time.txt or system.log. So each read
          # of one ends in || true and falls back to its default (0, empty or
          # unknown), which job.json and the summary then show; nothing here may
          # end the step before job.json and the logs are kept.
          set -uo pipefail
          WORK="$RUNNER_TEMP/bench/R$WINDOW"
          OUT="$RUNNER_TEMP/out"
          LOGS="$RUNNER_TEMP/logs"
          mkdir -p "$OUT"

          # Only the manifest, the results of a read and the metrics, never db/:
          # the database is gigabytes.
          manifest=no
          if [ -f "$WORK/$SLUG/manifest.json" ]; then
            cp "$WORK/$SLUG/manifest.json" "$OUT/manifest.json"
            manifest=yes
          fi
          results=no
          if [ -f "$WORK/$SLUG/results.json" ]; then
            cp "$WORK/$SLUG/results.json" "$OUT/results.json"
            results=yes
          fi
          if [ -f "$WORK/$SLUG/metrics.jsonl" ]; then
            cp "$WORK/$SLUG/metrics.jsonl" "$OUT/metrics.jsonl"
          fi

          # What this job was and what it ran on, so a manifest can be judged
          # without the run page. Hosted runners of one label are not one machine:
          # the CPU model can differ from job to job, and a timing is only
          # comparable within one model. The offline judge must therefore compare
          # candidates only within one CPU model, or require reps >= 3.
          cpu="$(lscpu 2>/dev/null | awk -F': *' '/^Model name/ { print $2; exit }' || true)"
          cpu="${cpu:-unknown}"
          cpus="$(nproc 2>/dev/null || echo 0)"
          mem_kb="$(awk '/^MemTotal/ { print $2 }' /proc/meminfo 2>/dev/null || true)"
          mem_kb="${mem_kb:-0}"
          kernel="$(uname -r)"
          image_os="${ImageOS:-unknown}"
          image_version="${ImageVersion:-unknown}"
          runner_name="${RUNNER_NAME:-unknown}"
          # The binary this job built and ran, to tell builds of one commit apart.
          if [ "$ENGINE" = rocksdb ]; then
            bin="$RUNNER_TEMP/rocksbench"
          else
            bin="$RUNNER_TEMP/spikebench"
          fi
          binary_sha256="$(sha256sum "$bin" 2>/dev/null | cut -d' ' -f1 || true)"
          binary_sha256="${binary_sha256:-unknown}"
          # The peak resident set of the build process and of the read, in KiB, as
          # GNU time reports them; 0 where there is none (the RocksDB rule's judge
          # refuses a set with a manifest and no max_rss_kb). A build killed for
          # memory still has one, and no manifest.
          max_rss_kb="$(awk -F': ' '/Maximum resident set size/ { print $2 }' "$LOGS/time.txt" 2>/dev/null || true)"
          [[ $max_rss_kb =~ ^[0-9]+$ ]] || max_rss_kb=0
          read_max_rss_kb="$(awk -F': ' '/Maximum resident set size/ { print $2 }' "$LOGS/read.time.txt" 2>/dev/null || true)"
          [[ $read_max_rss_kb =~ ^[0-9]+$ ]] || read_max_rss_kb=0
          # Which RocksDB library the binary linked: its build stamp's sha256 (the
          # stamp itself is in the manifest's description), the cache entry it came
          # from, and the Ubuntu packages of the libraries it links and the compiler
          # cgo used. Empty for a Pebble build.
          stamp_sha256=""
          libraries=""
          if [ "$ENGINE" = rocksdb ]; then
            stamp_sha256="$(sha256sum "$ROCKSDB_PREFIX/lib/rocksdb-build.stamp" 2>/dev/null | cut -d' ' -f1 || true)"
            libraries="$(dpkg-query --show liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev libstdc++6 g++ 2>/dev/null | tr '\t' '=' | paste -sd' ' - || true)"
          fi
          # go_mem_limit is the dispatch's for both engines: a RocksDB build ran
          # under that less the plan's cache and four memtables, which its manifest
          # records as go_memory_limit. The job file is two objects joined: the
          # runner's job (runner.Job), then what the RocksDB rule's judge adds to it
          # (rulejudge.Job); a test in each package requires its own fields here,
          # in order.
          jq -n \
            --arg sha "$SHA" --arg os "$OS" --arg arch "$(uname -m)" \
            --arg family "$FAMILY" --argjson window "$WINDOW" --arg candidate "$CANDIDATE" \
            --argjson rep "$REP" --argjson pins_window "$PINS_WINDOW" \
            --arg sync "$SYNC" --arg metrics_every "$METRICS_EVERY" \
            --arg go_mem_limit "$GO_MEM_LIMIT" \
            --arg retention_mode "$RETENTION_MODE" --argjson pace "$PACE" \
            --arg retain_flush_dels "$RETAIN_FLUSH_DELS" --arg ref "$REF" --arg expected_sha "$EXPECTED_SHA" \
            --arg cpu_model "$cpu" --argjson nproc "$cpus" --argjson mem_total_kb "$mem_kb" \
            --arg image_os "$image_os" --arg image_version "$image_version" \
            --arg runner_name "$runner_name" --arg kernel "$kernel" \
            --arg run_id "$RUN_ID" --arg run_attempt "$RUN_ATTEMPT" \
            --arg binary_sha256 "$binary_sha256" \
            --arg engine "$ENGINE" --argjson max_rss_kb "$max_rss_kb" --argjson read_max_rss_kb "$read_max_rss_kb" \
            --arg rocksdb_stamp_sha256 "$stamp_sha256" --arg rocksdb_cache_key "${ROCKSDB_CACHE_KEY:-}" \
            --arg rocksdb_cache_hit "${ROCKSDB_CACHE_HIT:-}" --arg rocksdb_libraries "$libraries" \
            '{sha: $sha, os: $os, arch: $arch, family: $family, window: $window, candidate: $candidate, rep: $rep, pins_window: $pins_window, sync: $sync, metrics_every: $metrics_every, go_mem_limit: $go_mem_limit, retention_mode: $retention_mode, pace: $pace, retain_flush_dels: $retain_flush_dels, ref: $ref, expected_sha: $expected_sha, cpu_model: $cpu_model, nproc: $nproc, mem_total_kb: $mem_total_kb, image_os: $image_os, image_version: $image_version, runner_name: $runner_name, kernel: $kernel, run_id: $run_id, run_attempt: $run_attempt, binary_sha256: $binary_sha256} + {engine: $engine, max_rss_kb: $max_rss_kb, read_max_rss_kb: $read_max_rss_kb, rocksdb_stamp_sha256: $rocksdb_stamp_sha256, rocksdb_cache_key: $rocksdb_cache_key, rocksdb_cache_hit: $rocksdb_cache_hit, rocksdb_libraries: $rocksdb_libraries}' \
            >"$OUT/job.json"

          if [ -d "$LOGS" ]; then
            cp -r "$LOGS" "$OUT/logs"
          fi

          rss="$(awk -F': ' '/Maximum resident set size/ { printf "%.0f MiB", $2 / 1024 }' "$LOGS/time.txt" 2>/dev/null || true)"
          read_rss="$(awk -F': ' '/Maximum resident set size/ { printf "%.0f MiB", $2 / 1024 }' "$LOGS/read.time.txt" 2>/dev/null || true)"
          elapsed="$(awk '/Elapsed \(wall clock\)/ { print $NF }' "$LOGS/time.txt" 2>/dev/null || true)"
          # The data line after each df header, by the section the sampler wrote
          # it under: the used 1K-blocks of the root filesystem, of /mnt and of
          # the filesystem the build writes to.
          disk="$(awk '
            /^== / { label = $2 }
            /^Filesystem/ { getline; if ($3 > max[label]) max[label] = $3 }
            END {
              for (l in max) {
                printf "%s%s %.1f GiB", sep, l, max[l] / 1048576
                sep = ", "
              }
            }' "$LOGS/system.log" 2>/dev/null || true)"
          {
            echo "### $CANDIDATE, $WINDOW days, $OS, repetition $REP"
            echo
            echo "- engine: $ENGINE"
            echo "- manifest written: $manifest; results of a read written: $results"
            echo "- peak memory: ${rss:-unknown}; of the read: ${read_rss:-none}"
            echo "- elapsed time (h:mm:ss or m:ss): ${elapsed:-unknown}"
            echo "- most disk used, sampled each minute (root, mnt and the work directory's filesystem): ${disk:-unknown}"
            echo "- hardware: $cpu, $cpus CPUs, $((mem_kb / 1024)) MiB memory, kernel $kernel"
            echo "- runner: $runner_name, image $image_os $image_version, run $RUN_ID attempt $RUN_ATTEMPT"
            echo "- retention mode: $RETENTION_MODE, pace $PACE, retention flush threshold $RETAIN_FLUSH_DELS"
            echo "- binary sha256: \`$binary_sha256\`"
            if [ "$ENGINE" = rocksdb ]; then
              echo "- RocksDB library: cache entry \`${ROCKSDB_CACHE_KEY:-none}\` (restored: ${ROCKSDB_CACHE_HIT:-no}), build stamp sha256 \`${stamp_sha256:-none}\`"
              echo "- packages: ${libraries:-unknown}"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the manifest and the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ needs.setup.outputs.family }}-R${{ matrix.window }}-${{ matrix.slug }}-${{ matrix.os }}-rep${{ matrix.rep }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          # A re-run of this job in the same run replaces the artifact.
          overwrite: true
          retention-days: 90

  # On a pull request that touches this workflow or the program, the whole chain
  # at the tiny preset: pins, plan, two candidates built, read and reported, and a
  # paced background build of the root store at a threshold, judged by the store
  # gate, with the refusals a dispatch of the gate relies on. Every step is timed
  # (no -untimed), so the guards of a timed build run exactly as they do in a
  # dispatch. It keeps nothing: its one artifact, the tiny plan handed to itself as
  # the plans job hands plans to the build jobs, expires after a day.
  dry-run:
    name: bench dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Go
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          install_args: go
          cache: false

      - name: Build spikebench
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the checkout has uncommitted or untracked changes, so a timed build would refuse the binary:" >&2
            git status --porcelain >&2
            exit 1
          fi
          cd bench
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/spikebench" ./cmd/spikebench

      - name: Choose the pins
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/spikebench" pins -out "$RUNNER_TEMP/dry" -preset tiny -events-per-second 0.05 -batch 40 -window 1

      - name: Make the plan
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dry"
          "$RUNNER_TEMP/spikebench" plan -out "$D/R1" -preset tiny -events-per-second 0.05 -batch 40 -window 1 -pins "$D/pins.json" -full

      # The plans job's upload and a build job's download, shaped as a dispatch has
      # them: plans/ and logs/ under one directory, uploaded as one artifact, and the
      # plan read back from plans/R<window>/plan.json.
      - name: Lay the plan out as the plans job does
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/kept"
          mkdir -p "$K/plans/R1" "$K/logs"
          cp "$RUNNER_TEMP/dry/R1/plan.json" "$K/plans/R1/plan.json"
          cp "$RUNNER_TEMP/dry/pins.json" "$K/plans/pins.json"
          echo "dry run" >"$K/logs/pins.log"

      - name: Keep it as the plans job does
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-plans-dry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kept/plans
            ${{ runner.temp }}/kept/logs
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Fetch it as a build job does
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-plans-dry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/planset

      - name: Check that the fetched plan is the plan made
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/dry/R1/plan.json" "$RUNNER_TEMP/planset/plans/R1/plan.json"

      - name: Build the first candidate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/spikebench" build -out "$RUNNER_TEMP/dry/R1" -candidate L/off

      - name: Build the second candidate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/spikebench" build -out "$RUNNER_TEMP/dry/R1" -candidate L/k64a2l1ns

      - name: Read both candidates
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dry/R1"
          "$RUNNER_TEMP/spikebench" read -out "$D" -candidate L/off
          "$RUNNER_TEMP/spikebench" read -out "$D" -candidate L/k64a2l1ns

      - name: Report
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/spikebench" report -out "$RUNNER_TEMP/dry/R1"

      # The store gate's dispatch at the tiny preset, before any real one: a build of
      # the root store in the background, paced from the day the rules give for its
      # window of one day (2.5) at a rung of the threshold ladder, then the refusals a
      # dispatch relies on. Each build has its own directory, with the plan above.
      - name: Build a paced background candidate at a threshold
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dry"
          mkdir -p "$D/bg" "$D/bg2"
          cp "$D/R1/plan.json" "$D/bg/plan.json"
          cp "$D/R1/plan.json" "$D/bg2/plan.json"
          "$RUNNER_TEMP/spikebench" build -out "$D/bg" -candidate Lroot/k64a2l1ns -sync -metrics-every 1s \
            -retention-mode background -pace 4500 -retain-flush-dels 16384
          if ! jq -e '.Describe.retain_flush_dels == "16384"' "$D/bg/Lroot_k64a2l1ns/manifest.json" >/dev/null; then
            echo "::error::the manifest does not record the threshold 16384" >&2
            exit 1
          fi

      - name: Refuse a threshold with a synchronous retention
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/dry"
          code=0
          "$RUNNER_TEMP/spikebench" build -out "$D/bg2" -candidate Lroot/k64a2l1ns -retention-mode sync -retain-flush-dels 16384 || code=$?
          if [ "$code" != 1 ]; then
            echo "::error::the refused build exited with $code, want 1" >&2
            exit 1
          fi
          if [ -e "$D/bg2/Lroot_k64a2l1ns" ]; then
            echo "::error::the refused build made its directory" >&2
            exit 1
          fi

      - name: Build the same candidate at another threshold
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/spikebench" build -out "$RUNNER_TEMP/dry/bg2" -candidate Lroot/k64a2l1ns -sync -metrics-every 1s \
            -retention-mode background -pace 4500 -retain-flush-dels 24576

      # A refused set ends storegate with 3 before it prints a verdict, so the paced
      # build is judged alone first, then with the other threshold.
      - name: Judge the paced build, and refuse a set of two thresholds
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/dry"
          commit="$(git rev-parse HEAD)"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }
          code=0
          "$RUNNER_TEMP/spikebench" storegate -commit "$commit" "$D/bg" >"$D/gate.txt" 2>&1 || code=$?
          cat "$D/gate.txt"
          [ "$code" != 3 ] || fail "storegate could not judge the paced build (status 3)"
          grep -q "the judged part" "$D/gate.txt" || fail "the report lacks the judged part"
          grep -q "retain_flush_dels 16384" "$D/gate.txt" || fail "the report lacks the threshold"
          code=0
          "$RUNNER_TEMP/spikebench" storegate -commit "$commit" "$D/bg" "$D/bg2" >"$D/pool.txt" 2>&1 || code=$?
          cat "$D/pool.txt"
          [ "$code" = 3 ] || fail "a set of two thresholds ended with status $code, want 3"
          grep -q "different retain_flush_dels" "$D/pool.txt" || fail "the refusal does not name the threshold"

  # On a pull request, the chain of layout L on RocksDB at the tiny preset, beside the
  # dry run above: the RocksDB library under the timed jobs' key and path, rocksbench
  # built as they build it, L/off and RL/off each built under GNU time and read, each
  # recorded with the fields of a timed job's job.json that the RocksDB rule's judge
  # reads, and rocksbench judge run on the two. One repetition each is too few for the
  # rule, so the judge must refuse the set with status 3 for that reason alone, having
  # read every build, its read and its peak resident set, and having found every
  # build a result: that proves the chain without a verdict. It takes the library
  # from the library job, as a timed job does, so the pull request proves that hand-
  # off too; that job builds the library on a miss (a pull request that changes the
  # build script, or before rocksdb.yml has saved the library on main). It uploads
  # nothing. The library job needs setup, which a pull request skips, so this job's
  # condition must say how it runs: without a status function it would get an
  # implicit success(), which the skipped setup makes false.
  dry-run-rocksdb:
    name: bench dry run, RocksDB (${{ matrix.os }})
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.rocksdb-library.result == 'success' }}
    needs: rocksdb-library
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The library job restores the library rocksdb.yml saves, by its key and path,
      # and the jobs here unpack it at that path, so the lines that name them must be
      # the same in both workflows (three times here).
      - name: Check that both workflows name the RocksDB build alike
        run: |
          set -euo pipefail
          for what in key prefix; do
            lines="$(grep -hF "echo \"$what=" .github/workflows/rocksdb.yml .github/workflows/bench.yml | sed 's/^ *//' | sort | uniq -c)"
            echo "$lines"
            # One line, written four times.
            if [ "$(awk '{ print $1 }' <<<"$lines")" != 4 ]; then
              echo "::error::rocksdb.yml and bench.yml do not name the RocksDB build's $what alike" >&2
              exit 1
            fi
          done

      - name: Install pinned Go
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          install_args: go
          cache: false

      - name: Check that GNU time is present
        run: |
          if [ ! -x /usr/bin/time ]; then
            sudo apt-get update && sudo apt-get install --yes time
          fi
          /usr/bin/time --version

      - name: Install the compiler and the libraries RocksDB links
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev
          dpkg-query --show build-essential cmake liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev g++

      - name: Name the RocksDB build
        id: rocks
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          script=bench/rocksdb/scripts/build-rocksdb.sh
          version="$("$script" --version)"
          hash="$(sha256sum "$script" | cut -d' ' -f1)"
          {
            echo "key=rocksdb-v1-${OS_LABEL}-${RUNNER_ARCH}-${version}-${hash}"
            echo "prefix=${RUNNER_TEMP}/rocksdb-${version}-${hash:0:16}"
          } >> "$GITHUB_OUTPUT"

      # The two steps of a timed job, as it has them.
      - name: Fetch the RocksDB build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-rocksdb-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rocksdb-artifact

      - name: Unpack the RocksDB build
        id: rockscache
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/rocksdb-artifact"
          (cd "$in" && sha256sum --check rocksdb.tar.sha256)
          top="$(tar -tf "$in/rocksdb.tar" | cut -d/ -f1 | sort -u)"
          if [ "$top" != "$(basename "$ROCKSDB_PREFIX")" ]; then
            echo "::error::the library artifact holds $top, not $(basename "$ROCKSDB_PREFIX")" >&2
            exit 1
          fi
          tar -C "$(dirname "$ROCKSDB_PREFIX")" --no-same-owner -xf "$in/rocksdb.tar"
          bench/rocksdb/scripts/build-rocksdb.sh --check-library "$ROCKSDB_PREFIX/lib/librocksdb.a"
          hit="$(cat "$in/cache-hit")"
          case "$hit" in
            true | false) echo "cache-hit=$hit" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::the library artifact's cache-hit is '$hit'" >&2; exit 1 ;;
          esac

      - name: Show how the library was built
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          cat "$ROCKSDB_PREFIX/lib/rocksdb-build.stamp"
          ls -l "$ROCKSDB_PREFIX/lib/librocksdb.a"

      # Both binaries as the timed jobs build them, after the same check.
      - name: Build spikebench and rocksbench
        env:
          ROCKSDB_PREFIX: ${{ steps.rocks.outputs.prefix }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the checkout has uncommitted or untracked changes, so a timed build would refuse the binary:" >&2
            git status --porcelain >&2
            exit 1
          fi
          (cd bench && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/spikebench" ./cmd/spikebench)
          cd bench/rocksdb
          ./scripts/cgoenv.sh go build -tags grocksdb_no_link,pebblegozstd -o "$RUNNER_TEMP/rocksbench" ./cmd/rocksbench

      - name: Make the pins and the plan
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dry"
          "$RUNNER_TEMP/spikebench" pins -out "$D" -preset tiny -events-per-second 0.05 -batch 40 -window 1
          "$RUNNER_TEMP/spikebench" plan -out "$D/R1" -preset tiny -events-per-second 0.05 -batch 40 -window 1 -pins "$D/pins.json" -full

      # Timed builds, as a dispatch without a Go memory limit runs them, each read
      # afterwards, each step under GNU time with a report of its own.
      - name: Build and read layout L on both engines
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dry/R1"
          L="$RUNNER_TEMP/dry/logs"
          mkdir -p "$L"
          /usr/bin/time -v -o "$L/L_off.time.txt" "$RUNNER_TEMP/spikebench" build -out "$D" -candidate L/off -retention-mode sync
          /usr/bin/time -v -o "$L/L_off.read.time.txt" "$RUNNER_TEMP/spikebench" read -out "$D" -candidate L/off
          /usr/bin/time -v -o "$L/RL_off.time.txt" "$RUNNER_TEMP/rocksbench" build -out "$D" -candidate RL/off -pebble-memory-limit none
          /usr/bin/time -v -o "$L/RL_off.read.time.txt" "$RUNNER_TEMP/rocksbench" read -out "$D" -candidate RL/off

      # Laid out as the artifacts of a dispatch: one directory per job with its
      # manifest, results and job.json, and the plan. The judge reads, of job.json,
      # the fields written here, which the timed jobs write the same way.
      - name: Record the builds as the timed jobs do
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dry/R1"
          L="$RUNNER_TEMP/dry/logs"
          A="$RUNNER_TEMP/artifacts"
          mkdir -p "$A/plans/R1"
          cp "$D/plan.json" "$A/plans/R1/plan.json"
          sha="$(git rev-parse HEAD)"
          cpu="$(lscpu 2>/dev/null | awk -F': *' '/^Model name/ { print $2; exit }')"
          cpu="${cpu:-unknown}"
          for c in L/off RL/off; do
            slug="${c//\//_}"
            case "$c" in
              RL/*) engine=rocksdb bin="$RUNNER_TEMP/rocksbench" ;;
              *) engine=pebble bin="$RUNNER_TEMP/spikebench" ;;
            esac
            out="$A/$slug"
            mkdir -p "$out"
            cp "$D/$slug/manifest.json" "$D/$slug/results.json" "$out/"
            max_rss_kb="$(awk -F': ' '/Maximum resident set size/ { print $2 }' "$L/$slug.time.txt" 2>/dev/null)"
            [[ $max_rss_kb =~ ^[0-9]+$ ]] || max_rss_kb=0
            read_max_rss_kb="$(awk -F': ' '/Maximum resident set size/ { print $2 }' "$L/$slug.read.time.txt" 2>/dev/null)"
            [[ $read_max_rss_kb =~ ^[0-9]+$ ]] || read_max_rss_kb=0
            binary_sha256="$(sha256sum "$bin" | cut -d' ' -f1)"
            jq -n \
              --arg sha "$sha" --arg os "$OS" --arg arch "$(uname -m)" --argjson window 1 --arg candidate "$c" \
              --argjson rep 1 --arg cpu_model "$cpu" --arg binary_sha256 "$binary_sha256" --arg engine "$engine" \
              --argjson max_rss_kb "$max_rss_kb" --argjson read_max_rss_kb "$read_max_rss_kb" \
              '{sha: $sha, os: $os, arch: $arch, window: $window, candidate: $candidate, rep: $rep, cpu_model: $cpu_model, binary_sha256: $binary_sha256, engine: $engine, max_rss_kb: $max_rss_kb, read_max_rss_kb: $read_max_rss_kb}' \
              >"$out/job.json"
            cat "$out/job.json"
          done

      # Status 3, every reason for it the single repetitions, no build that is not a
      # result, and a peak resident set for each of the two builds.
      - name: Judge the two, and refuse them for their repetitions alone
        run: |
          set -uo pipefail
          R="$RUNNER_TEMP/judge.txt"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }
          code=0
          "$RUNNER_TEMP/rocksbench" judge "$RUNNER_TEMP/artifacts" >"$R" 2>"$RUNNER_TEMP/judge.err" || code=$?
          cat "$R" "$RUNNER_TEMP/judge.err"
          [ "$code" = 3 ] || fail "the judge ended with status $code, want 3 for single repetitions"
          refused="$(awk '/^REFUSED:/ { on = 1; next } on && /^$/ { exit } on' "$R")"
          [ -n "$refused" ] || fail "the report gives no reason for the refusal"
          if grep -vF "has 1 repetitions, fewer than 3" <<<"$refused"; then
            fail "the set is refused for more than its repetitions (the reasons above)"
          fi
          if grep -q "^NOT RESULTS" "$R"; then
            fail "a build is not a result (the report above)"
          fi
          builds="$(awk '/^BUILDS:/ { on = 1; getline; next } on && NF' "$R")"
          [ "$(grep -c . <<<"$builds")" = 2 ] || fail "the report does not list the two builds"
          [ "$(grep -c " MiB" <<<"$builds")" = 2 ] || fail "a build has no peak resident set in the report"
