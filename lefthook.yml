# Git hooks are a convenience. CI runs the same checks and is the enforcement.
# Install with: mise run hooks
#
# Hooks run outside an interactive shell, where mise's tools are not on PATH,
# so every command goes through `mise exec`.

pre-commit:
  parallel: true
  commands:
    secrets:
      run: mise exec -- gitleaks git --staged --redact --no-banner
    spelling:
      glob: "*.{go,md,yml,yaml,toml}"
      run: mise exec -- typos {staged_files}
    format:
      glob: "*.go"
      run: mise exec -- golangci-lint fmt --diff && cd bench && mise exec -- golangci-lint fmt --diff

# Everything CI runs on a pull request, before a push. go test reuses the result
# of every package that has not changed since it last passed, so after a passing
# mise run ci this takes a few seconds; after a change it costs what the change
# reaches (a minute for one that reaches every Pebble package). It checks the
# working tree, which can hold changes the pushed commits do not.
pre-push:
  commands:
    ci:
      run: mise run ci
