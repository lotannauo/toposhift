# Git hooks are a convenience. CI runs these checks and more, and is the enforcement.
# Install with: mise run hooks
#
# Hooks run outside an interactive shell, where mise's tools are not on PATH,
# so every command goes through `mise exec`.

pre-commit:
  parallel: true
  commands:
    secrets:
      run: mise exec -- gitleaks git --staged --redact --no-banner
    spelling:
      glob: "*.{go,md,yml,yaml,toml}"
      run: mise exec -- typos {staged_files}
    format:
      glob: "*.go"
      run: mise exec -- golangci-lint fmt --diff && cd bench && mise exec -- golangci-lint fmt --diff

# The push runs only the static checks: formatting, lint, spelling, the
# no-results check, the CI shard list and a secret scan (mise run check:static).
# It runs no tests, because the pull request CI runs them and running them here
# only repeats that work at a cost of minutes per push. What it catches is the
# format, lint, spelling, tracked-results, shard-list and secret problems that
# would otherwise fail the pull request after the push. Like the old hook it
# checks the working tree, which can hold changes the pushed commits do not.
# Run mise run check between edits to test locally.
pre-push:
  commands:
    static:
      run: mise run check:static
