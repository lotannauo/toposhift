# Tool versions for local development and CI. CI installs exactly these.
# Go dev tools that live in go.mod (govulncheck) are run with `go tool`.

[tools]
go = "1.27.3"
golangci-lint = "2.14.0"
gitleaks = "8.30.1"
lefthook = "2.1.15"
typos = "1.50.3"
actionlint = "1.7.12"
zizmor = "1.30.1"
shellcheck = "0.11.0"
jq = "1.8.2"
gotestsum = "1.13.0"

[tasks.fmt]
description = "Format Go code in place, including the bench module and its RocksDB, Postgres, metrics-store, DuckDB and XTDB modules"
run = [
  "golangci-lint fmt",
  "cd bench && golangci-lint fmt",
  "cd bench/rocksdb && golangci-lint fmt",
  "cd bench/postgres && golangci-lint fmt",
  "cd bench/victoria && golangci-lint fmt",
  "cd bench/duckdb && golangci-lint fmt",
  "cd bench/xtdb && golangci-lint fmt",
]

[tasks."fmt:check"]
description = "Fail if any Go file is not formatted"
run = "golangci-lint fmt --diff"

# The lints and the vulnerability scans each load every package of their module
# with its tests, which compiles the whole graph when the build cache is cold (a
# runner after a Go toolchain bump). Four of them at once on four processors each
# compiled the same packages, since the build cache shares a package only once
# one of them has written it, and the linter ran past its timeout. So they wait
# for warm, which compiles each module's graph once, test variants included, the
# way go/packages asks for it (export data). With a warm cache it is seconds.
[tasks.warm]
description = "Compile both modules' packages and tests once into the build cache, for the lints and scans"
hide = true
run = '''
set -eu
go list -export -test -deps ./... >/dev/null
cd bench && go list -export -test -deps ./... >/dev/null
'''

# golangci-lint takes a file lock by default and fails a second concurrent run.
# `mise run ci` runs the root and bench lints at the same time, so both allow it.
[tasks.lint]
description = "Lint Go code"
depends = ["warm"]
run = "golangci-lint run --allow-parallel-runners"

# The bench module is separate (it carries a replace directive the root module
# must never have), so the root tasks above do not descend into it.
[tasks."bench:fmt:check"]
description = "Fail if any Go file in the bench module is not formatted"
dir = "bench"
run = "golangci-lint fmt --diff"

[tasks."bench:lint"]
description = "Lint the bench module"
dir = "bench"
depends = ["warm"]
run = "golangci-lint run --allow-parallel-runners"

# The bench tests run in two tiers. Pebble turns its own invariant checks on with
# the build tags invariants or race, and it is the race detector, not the checks,
# that makes the tests slow (about 20 s with the checks and 190 s with the race
# detector). So the full matrix runs here with the checks on and cgo off, which
# is also how toposhift is built, and the race detector runs in bench:test:race on
# the part of the tests that starts goroutines. bench:test:deep is the whole
# matrix under the race detector, for pushes to main and the nightly run.
#
# bench:test, bench:test:race and test let go test reuse a package's result when
# neither the test binary nor an input it records (a file it opened, an
# environment variable it read) has changed since a passing run, so a change
# that touches no Go code reruns no test. A reused result is not a new run: the
# random workloads keep the seeds they had, and the concurrency checks are not
# scheduled anew. The deep run always runs everything (-count=1) in random order.
[tasks."bench:test"]
description = "Run the bench module's full tests with Pebble's invariant checks on, cgo off"
dir = "bench"
env = { CGO_ENABLED = "0", TOPOSHIFT_REQUIRE_INVARIANTS = "1", TOPOSHIFT_RAPID_CHECKS = "40" }
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-test.json"} -- -tags invariants ./...'

[tasks."bench:test:race"]
description = "Run the bench module's trimmed tests with the race detector"
dir = "bench"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-test-race.json"} -- -race -short -timeout 15m ./...'

# The same tier in two halves, as test:race:heavy and test:race:rest split the
# root module (see the ci task): raceshards' bench list names the slowest
# packages, run from the root module, where the command lives.
[tasks."bench:test:race:heavy"]
description = "The slowest packages of the bench module's trimmed tests with the race detector (see internal/raceshards)"
hide = true
dir = "bench"
run = '''
set -eu
all="$(go list ./...)"
pkgs="$(printf '%s\n' "$all" | (cd .. && go run ./internal/raceshards -module bench heavy))"
# shellcheck disable=SC2086 # the list is one package a line
gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-test-raceheavy.json"} -- -race -short -timeout 15m $pkgs
'''

[tasks."bench:test:race:rest"]
description = "The other packages of the bench module's trimmed tests with the race detector (see internal/raceshards)"
hide = true
dir = "bench"
run = '''
set -eu
all="$(go list ./...)"
pkgs="$(printf '%s\n' "$all" | (cd .. && go run ./internal/raceshards -module bench rest))"
# shellcheck disable=SC2086 # the list is one package a line
gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-test-racerest.json"} -- -race -short -timeout 15m $pkgs
'''

[tasks."bench:test:deep"]
description = "Run the bench module's full tests with the race detector, in random order"
dir = "bench"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-test-deep.json"} -- -race -shuffle=on -count=1 -timeout 60m ./...'

[tasks."bench:vuln"]
description = "Scan the bench module's dependencies for known vulnerabilities"
dir = "bench"
depends = ["warm"]
run = "go tool govulncheck ./..."

# The RocksDB baseline (layout L on RocksDB) is a module of its own, bench/rocksdb,
# because it needs cgo and a native library, which the bench module's builds and
# tests never have (./... in bench stops at its go.mod). Its formatting needs no
# cgo and is checked in the static shard; its lint, vulnerability scan and tests
# compile cgo against RocksDB, so they run where RocksDB is installed: the pinned
# Homebrew library on a Mac (ROCKSDB_PREFIX, default /opt/homebrew), or wherever a CI
# job built it (it sets CGO_CFLAGS and CGO_LDFLAGS). scripts/cgoenv.sh sets cgo up;
# grocksdb_no_link leaves the link flags to it, and pebblegozstd keeps the cgo zstd
# out of the Pebble that the module links for layout L's shared code.
[tasks."bench:rocksdb:fmt:check"]
description = "Fail if any Go file in the RocksDB module is not formatted"
dir = "bench/rocksdb"
run = "golangci-lint fmt --diff"

[tasks."bench:rocksdb:lint"]
description = "Lint the RocksDB module (needs RocksDB installed)"
dir = "bench/rocksdb"
run = "./scripts/cgoenv.sh golangci-lint run --allow-parallel-runners --build-tags grocksdb_no_link,pebblegozstd"

[tasks."bench:rocksdb:vuln"]
description = "Scan the RocksDB module's Go dependencies for known vulnerabilities (needs RocksDB installed; C and C++ code is not scanned)"
dir = "bench"
run = "rocksdb/scripts/cgoenv.sh go tool govulncheck -C rocksdb -tags grocksdb_no_link,pebblegozstd ./..."

[tasks."bench:rocksdb:test"]
description = "Run the RocksDB module's full tests (needs RocksDB installed)"
dir = "bench/rocksdb"
env = { TOPOSHIFT_RAPID_CHECKS = "40" }
run = './scripts/cgoenv.sh gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-rocksdb-test.json"} -- -tags grocksdb_no_link,pebblegozstd -p 2 -timeout 25m ./...'

[tasks."bench:rocksdb:test:race"]
description = "Run the RocksDB module's trimmed tests with the race detector (needs RocksDB installed; the detector does not see C++)"
dir = "bench/rocksdb"
run = './scripts/cgoenv.sh gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-rocksdb-test-race.json"} -- -tags grocksdb_no_link,pebblegozstd -race -short -p 2 -timeout 25m ./...'

# The Postgres baseline (bench/postgres) is a module of its own so that a database
# driver and a server to test against stay out of the bench module's graph. It is
# pure Go, so unlike the RocksDB module's, all of its checks fit the shards. It links
# layout L's shared code and so Pebble, hence the cgo-free build check. Its tests that
# need a Postgres server skip without TOPOSHIFT_PG_DSN; bench:postgres:test:server runs
# them against a server, and only postgres.yml, which starts one, does.
[tasks."bench:postgres:fmt:check"]
description = "Fail if any Go file in the Postgres module is not formatted"
dir = "bench/postgres"
run = "golangci-lint fmt --diff"

[tasks."bench:postgres:lint"]
description = "Lint the Postgres module"
dir = "bench/postgres"
run = "golangci-lint run --allow-parallel-runners"

[tasks."bench:postgres:vuln"]
description = "Scan the Postgres module's dependencies for known vulnerabilities"
dir = "bench"
run = "go tool govulncheck -C postgres ./..."

[tasks."bench:postgres:test"]
description = "Run the Postgres module's full tests, cgo off"
dir = "bench/postgres"
env = { CGO_ENABLED = "0", TOPOSHIFT_RAPID_CHECKS = "40" }
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-postgres-test.json"} -- -p 2 -timeout 25m ./...'

[tasks."bench:postgres:test:server"]
description = "Run the Postgres module's server tests against a live server (TOPOSHIFT_PG_DSN names it; bench/postgres/scripts/pg-server.sh starts the one the settings are written for)"
dir = "bench/postgres"
env = { CGO_ENABLED = "0", TOPOSHIFT_RAPID_CHECKS = "8" }
run = '''
set -eu
: "${TOPOSHIFT_PG_DSN:?TOPOSHIFT_PG_DSN must name the server, see bench/postgres/scripts/pg-server.sh}"
gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-postgres-test-server.json"} -- -count=1 -p 1 -timeout 40m ./pgengine/...
'''

[tasks."bench:postgres:test:race"]
description = "Run the Postgres module's trimmed tests with the race detector"
dir = "bench/postgres"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-postgres-test-race.json"} -- -race -short -p 2 -timeout 25m ./...'

# The same check as bench:purego, on the module that links Pebble through bench/spike
# and reads activity files, so the ban on gRPC and Arrow's Flight, cdata and pqarrow
# applies to it as well.
[tasks."bench:postgres:purego"]
description = "Build the Postgres module with CGO disabled and check no cgo zstd, gRPC, Arrow Flight, Arrow cdata or pqarrow is linked"
dir = "bench/postgres"
run = '''
set -eu
export CGO_ENABLED=0
go build ./...
# See bench:purego for why the cgo-on count must be above zero.
deps() {
  list="$(CGO_ENABLED="$1" go list -deps -tags "$2" ./...)" || { echo "bench:postgres:purego: go list failed" >&2; echo ERR; exit 1; }
  printf '%s\n' "$list" | grep -c 'github.com/DataDog/zstd' || true
}
cgo_default="$(deps 1 "")"
nocgo_default="$(deps 0 "")"
cgo_tagged="$(deps 1 pebblegozstd)"
if [ "$cgo_default" = 0 ]; then
  echo "bench:postgres:purego: the cgo zstd is not in a default build, so this check no longer proves anything" >&2
  exit 1
fi
if [ "$nocgo_default" != 0 ] || [ "$cgo_tagged" != 0 ]; then
  echo "bench:postgres:purego: the cgo zstd is linked with cgo off, or with the pebblegozstd tag" >&2
  exit 1
fi
for cgo in 0 1; do
  all="$(CGO_ENABLED=$cgo go list -deps ./...)" || { echo "bench:postgres:purego: go list failed" >&2; exit 1; }
  bad="$(printf '%s\n' "$all" | grep -E '^(google\.golang\.org/grpc|github\.com/apache/arrow-go/v18/(arrow/flight|arrow/cdata|parquet/pqarrow))(/|$)' || true)"
  if [ -n "$bad" ]; then
    echo "bench:postgres:purego: with CGO_ENABLED=$cgo these packages must not be in the build:" >&2
    printf '%s\n' "$bad" >&2
    exit 1
  fi
done
'''

# The metrics-store baseline (bench/victoria) is a module of its own so that the
# server it is tested against stays out of the bench module's graph. It is pure Go, so
# all of its checks fit the shards. It links layout L's shared code and so Pebble, hence
# the cgo-free build check. Its tests that need a metrics-store server skip without
# TOPOSHIFT_VM_URL (there are none yet).
[tasks."bench:victoria:fmt:check"]
description = "Fail if any Go file in the metrics-store module is not formatted"
dir = "bench/victoria"
run = "golangci-lint fmt --diff"

[tasks."bench:victoria:lint"]
description = "Lint the metrics-store module"
dir = "bench/victoria"
run = "golangci-lint run --allow-parallel-runners"

[tasks."bench:victoria:vuln"]
description = "Scan the metrics-store module's dependencies for known vulnerabilities"
dir = "bench"
run = "go tool govulncheck -C victoria ./..."

[tasks."bench:victoria:test"]
description = "Run the metrics-store module's full tests, cgo off"
dir = "bench/victoria"
env = { CGO_ENABLED = "0", TOPOSHIFT_RAPID_CHECKS = "40" }
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-victoria-test.json"} -- -p 2 -timeout 25m ./...'

[tasks."bench:victoria:test:race"]
description = "Run the metrics-store module's trimmed tests with the race detector"
dir = "bench/victoria"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-victoria-test-race.json"} -- -race -short -p 2 -timeout 25m ./...'

# The same check as bench:purego, on the module that links Pebble through bench/spike.
[tasks."bench:victoria:purego"]
description = "Build the metrics-store module with CGO disabled and check no cgo zstd, gRPC, Arrow Flight, Arrow cdata or pqarrow is linked"
dir = "bench/victoria"
run = '''
set -eu
export CGO_ENABLED=0
go build ./...
# See bench:purego for why the cgo-on count must be above zero.
deps() {
  list="$(CGO_ENABLED="$1" go list -deps -tags "$2" ./...)" || { echo "bench:victoria:purego: go list failed" >&2; echo ERR; exit 1; }
  printf '%s\n' "$list" | grep -c 'github.com/DataDog/zstd' || true
}
cgo_default="$(deps 1 "")"
nocgo_default="$(deps 0 "")"
cgo_tagged="$(deps 1 pebblegozstd)"
if [ "$cgo_default" = 0 ]; then
  echo "bench:victoria:purego: the cgo zstd is not in a default build, so this check no longer proves anything" >&2
  exit 1
fi
if [ "$nocgo_default" != 0 ] || [ "$cgo_tagged" != 0 ]; then
  echo "bench:victoria:purego: the cgo zstd is linked with cgo off, or with the pebblegozstd tag" >&2
  exit 1
fi
for cgo in 0 1; do
  all="$(CGO_ENABLED=$cgo go list -deps ./...)" || { echo "bench:victoria:purego: go list failed" >&2; exit 1; }
  bad="$(printf '%s\n' "$all" | grep -E '^(google\.golang\.org/grpc|github\.com/apache/arrow-go/v18/(arrow/flight|arrow/cdata|parquet/pqarrow))(/|$)' || true)"
  if [ -n "$bad" ]; then
    echo "bench:victoria:purego: with CGO_ENABLED=$cgo these packages must not be in the build:" >&2
    printf '%s\n' "$bad" >&2
    exit 1
  fi
done
'''

# The DuckDB baseline (bench/duckdb) is a module of its own: its driver, which a later
# change adds, links DuckDB's native library, so its checks run in duckdb.yml, outside the
# four ci shards, as the RocksDB module's do. Until the driver exists it is pure Go, and
# its tests run with cgo off.
[tasks."bench:duckdb:fmt:check"]
description = "Fail if any Go file in the DuckDB module is not formatted"
dir = "bench/duckdb"
run = "golangci-lint fmt --diff"

[tasks."bench:duckdb:lint"]
description = "Lint the DuckDB module"
dir = "bench/duckdb"
run = "golangci-lint run --allow-parallel-runners"

[tasks."bench:duckdb:vuln"]
description = "Scan the DuckDB module's dependencies for known vulnerabilities"
dir = "bench"
run = "go tool govulncheck -C duckdb ./..."

[tasks."bench:duckdb:test"]
description = "Run the DuckDB module's full tests, cgo off"
dir = "bench/duckdb"
env = { CGO_ENABLED = "0", TOPOSHIFT_RAPID_CHECKS = "40" }
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-duckdb-test.json"} -- -p 2 -timeout 25m ./...'

[tasks."bench:duckdb:test:race"]
description = "Run the DuckDB module's trimmed tests with the race detector"
dir = "bench/duckdb"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-duckdb-test-race.json"} -- -race -short -p 2 -timeout 25m ./...'

# The XTDB baseline (bench/xtdb) is a module of its own so that a database driver and
# a server to test against stay out of the bench module's graph. It is pure Go. Its
# checks run in .github/workflows/xtdb.yml, outside the four ci shards, so that
# `mise run ci` stays unchanged and a later step can add tests that need an XTDB
# server, which no shard has. It links layout L's shared code, and so Pebble, through
# bench/spike. Its tests that need an XTDB server will skip without
# TOPOSHIFT_XTDB_DSN (there are none yet).
[tasks."bench:xtdb:fmt:check"]
description = "Fail if any Go file in the XTDB module is not formatted"
dir = "bench/xtdb"
run = "golangci-lint fmt --diff"

[tasks."bench:xtdb:lint"]
description = "Lint the XTDB module"
dir = "bench/xtdb"
run = "golangci-lint run --allow-parallel-runners"

[tasks."bench:xtdb:vuln"]
description = "Scan the XTDB module's dependencies for known vulnerabilities"
dir = "bench"
run = "go tool govulncheck -C xtdb ./..."

[tasks."bench:xtdb:test"]
description = "Run the XTDB module's full tests, cgo off"
dir = "bench/xtdb"
env = { CGO_ENABLED = "0", TOPOSHIFT_RAPID_CHECKS = "40" }
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-xtdb-test.json"} -- -p 2 -timeout 25m ./...'

[tasks."bench:xtdb:test:race"]
description = "Run the XTDB module's trimmed tests with the race detector"
dir = "bench/xtdb"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-xtdb-test-race.json"} -- -race -short -p 2 -timeout 25m ./...'

# toposhift must build and boot with CGO disabled. Pebble picks its zstd by a
# build constraint: pure Go when cgo is off or the pebblegozstd tag is set, the
# cgo DataDog/zstd otherwise. The tests run with cgo off in bench:test, so this
# builds the bench module with cgo off and checks that neither way of asking for
# pure Go leaves the cgo library in the build.
[tasks."bench:purego"]
description = "Build the bench module with CGO disabled and check no cgo zstd is linked"
dir = "bench"
run = '''
set -eu
export CGO_ENABLED=0
go build ./...
# The check below must be able to fail: with cgo on and no tag, Pebble does link
# the cgo zstd. The package list is captured first, so a failing go list stops
# the task (a pipeline into grep -q would hide it, and grep -q closing the pipe
# early makes pipefail unusable). A go list that fails inside $(...) within [ ]
# would not stop the task, and the positive control would pass on nothing, so
# deps stops the task itself, and its results are taken in assignments first.
deps() {
  list="$(CGO_ENABLED="$1" go list -deps -tags "$2" ./...)" || { echo "bench:purego: go list failed" >&2; echo ERR; exit 1; }
  printf '%s\n' "$list" | grep -c 'github.com/DataDog/zstd' || true
}
cgo_default="$(deps 1 "")"
nocgo_default="$(deps 0 "")"
cgo_tagged="$(deps 1 pebblegozstd)"
if [ "$cgo_default" = 0 ]; then
  echo "bench:purego: the cgo zstd is not in a default build, so this check no longer proves anything" >&2
  exit 1
fi
if [ "$nocgo_default" != 0 ] || [ "$cgo_tagged" != 0 ]; then
  echo "bench:purego: the cgo zstd is linked with cgo off, or with the pebblegozstd tag" >&2
  exit 1
fi
'''

# The product is built with CGO disabled, and the module that holds
# the store must keep building that way. Pebble picks its zstd by a build
# constraint: pure Go when cgo is off or the pebblegozstd tag is set, the cgo
# DataDog/zstd otherwise, which a machine with a C compiler (the post-merge go
# install job, a developer's laptop) would compile in. So this builds the whole
# module with cgo off, builds the binary with the tag as well, and checks that
# neither way of asking for pure Go leaves the cgo library in the package graph.
#
# One more rule keeps out what activity files must not bring in. With cgo off
# and with cgo on, none of gRPC, Arrow Flight, Arrow's C data interface or parquet/pqarrow is in
# the graph: activity files are written with arrow-go's low-level Parquet
# packages, and pqarrow imports Arrow Flight, which brings gRPC into every
# binary that links it. That no package needs cgo is what the cgo-off build at
# the top proves: a package whose files all import "C" fails it, and go list
# reports no cgo files at all when cgo is off, so listing them would prove
# nothing. (With cgo on, Pebble's own manual memory package has cgo files, which
# is why that graph is not checked for them.)
[tasks.purego]
description = "Build with CGO disabled and check no cgo zstd, gRPC, Arrow Flight, Arrow cdata or pqarrow is linked"
run = '''
set -eu
export CGO_ENABLED=0
go build ./...
go build -tags pebblegozstd -o /dev/null ./cmd/toposhift
# The check below must be able to fail: with cgo on and no tag, Pebble does link
# the cgo zstd. The package list is captured first, so a failing go list stops
# the task (a pipeline into grep -q would hide it, and grep -q closing the pipe
# early makes pipefail unusable). A go list that fails inside $(...) within [ ]
# would not stop the task, and the positive control would pass on nothing, so
# deps stops the task itself, and its results are taken in assignments first.
deps() {
  list="$(CGO_ENABLED="$1" go list -deps -tags "$2" ./...)" || { echo "purego: go list failed" >&2; echo ERR; exit 1; }
  printf '%s\n' "$list" | grep -c 'github.com/DataDog/zstd' || true
}
cgo_default="$(deps 1 "")"
nocgo_default="$(deps 0 "")"
cgo_tagged="$(deps 1 pebblegozstd)"
if [ "$cgo_default" = 0 ]; then
  echo "purego: the cgo zstd is not in a default build, so this check no longer proves anything" >&2
  exit 1
fi
if [ "$nocgo_default" != 0 ] || [ "$cgo_tagged" != 0 ]; then
  echo "purego: the cgo zstd is linked with cgo off, or with the pebblegozstd tag" >&2
  exit 1
fi
# The ban is checked with cgo off and with cgo on, so that an import behind a
# build tag that only cgo sets is found as well.
for cgo in 0 1; do
  all="$(CGO_ENABLED=$cgo go list -deps ./...)" || { echo "purego: go list failed" >&2; exit 1; }
  bad="$(printf '%s\n' "$all" | grep -E '^(google\.golang\.org/grpc|github\.com/apache/arrow-go/v18/(arrow/flight|arrow/cdata|parquet/pqarrow))(/|$)' || true)"
  if [ -n "$bad" ]; then
    echo "purego: with CGO_ENABLED=$cgo these packages must not be in the build:" >&2
    printf '%s\n' "$bad" >&2
    exit 1
  fi
done
'''

# What Pebble writes depends on its version, and the format of a database is
# decided by the version that wrote it, so the root and bench modules must build
# (and the RocksDB module, which links layout L's shared code) on one Pebble, the
# one the measurements were made on. A bump changes the bytes
# and needs a new measurement; it is made in this task, in go.mod, in bench/go.mod
# and in internal/store/pebblekv/pins_test.go together.
[tasks."check:pebble-pin"]
description = "Fail unless the root, bench, RocksDB, Postgres and metrics-store modules all use the pinned Pebble version and the same compression libraries"
run = '''
set -eu
want=v2.1.7
# A replaced module is not the pinned version, whatever version it reports.
version='if .Replace then "replaced" else .Version end'
root="$(go list -m -json github.com/cockroachdb/pebble/v2 | jq -r "$version")"
bench="$(cd bench && go list -m -json github.com/cockroachdb/pebble/v2 | jq -r "$version")"
# The RocksDB module links layout L's shared code, and through it Pebble.
rocks="$(cd bench/rocksdb && go list -m -json github.com/cockroachdb/pebble/v2 | jq -r "$version")"
# The Postgres module links the same code, through bench/spike.
pg="$(cd bench/postgres && go list -m -json github.com/cockroachdb/pebble/v2 | jq -r "$version")"
# The metrics-store module links the same code, through bench/spike.
vm="$(cd bench/victoria && go list -m -json github.com/cockroachdb/pebble/v2 | jq -r "$version")"
if [ "$root" != "$want" ] || [ "$bench" != "$want" ] || [ "$rocks" != "$want" ] || [ "$pg" != "$want" ] || [ "$vm" != "$want" ]; then
  echo "check:pebble-pin: Pebble is $root in the root module, $bench in bench, $rocks in bench/rocksdb, $pg in bench/postgres and $vm in bench/victoria, all must be $want" >&2
  exit 1
fi
# The libraries that compress Pebble's blocks shape the bytes it writes as much as
# its own version does, so the two modules must agree on them too. A go list that
# fails fails the task: it is run on its own, not inside a pipeline.
mods() {
  all="$(go list -m -json all)" || exit 1
  printf '%s\n' "$all" | jq -r '"\(.Path) \(.Version // "")"'
}
rootmods="$(mods)" || exit 1
benchmods="$(cd bench && mods)" || exit 1
rocksmods="$(cd bench/rocksdb && mods)" || exit 1
pgmods="$(cd bench/postgres && mods)" || exit 1
vmmods="$(cd bench/victoria && mods)" || exit 1
version_in() { printf '%s\n' "$1" | awk -v m="$2" '$1 == m { print $2 }'; }
for mod in github.com/golang/snappy github.com/klauspost/compress github.com/minio/minlz github.com/DataDog/zstd; do
  root="$(version_in "$rootmods" "$mod")"
  bench="$(version_in "$benchmods" "$mod")"
  rocks="$(version_in "$rocksmods" "$mod")"
  pg="$(version_in "$pgmods" "$mod")"
  vm="$(version_in "$vmmods" "$mod")"
  if [ "$root" != "$bench" ] || [ "$root" != "$rocks" ] || [ "$root" != "$pg" ] || [ "$root" != "$vm" ]; then
    root="${root:-absent}"
    bench="${bench:-absent}"
    rocks="${rocks:-absent}"
    pg="${pg:-absent}"
    vm="${vm:-absent}"
    echo "check:pebble-pin: $mod is $root in the root module, $bench in bench, $rocks in bench/rocksdb, $pg in bench/postgres and $vm in bench/victoria, they must match" >&2
    exit 1
  fi
done
'''

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = [
  "actionlint",
  "zizmor --min-severity low .github/workflows",
]

[tasks."check:collector"]
description = "Validate the OpenTelemetry collector configurations (toposhift.yaml with its node agents and trace metrics opt-ins, and the optional nodeagent.yaml and tracemetrics.yaml) with the collector itself, and check that a misspelt key is refused"
# Pulls the image when it is absent (about 100 MB). Without Docker, or when the
# pull fails, it skips locally and fails when CI is true. If the CI runner's
# egress policy ever moves from audit to block, it must allow registry-1.docker.io,
# auth.docker.io and production.cloudflare.docker.com.
# OTELCOL_IMAGE is the collector image that deploy/otel-collector/toposhift.yaml,
# nodeagent.yaml and tracemetrics.yaml are validated with: the tag and the
# multi-arch index digest, bumped together.
env = { OTELCOL_IMAGE = "otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6" }
run = '''
set -eu
img="$OTELCOL_IMAGE"
cfg="deploy/otel-collector/toposhift.yaml"
gate="--feature-gates=pkg.experimentalmetricmetadata.useEntityEventsSpecification"
ci=false
if [ "${CI:-}" = true ]; then ci=true; fi

# Docker, and the image (pulled only when absent).
if ! err="$(docker info 2>&1 >/dev/null)"; then
  if [ "$ci" = true ]; then echo "check:collector: Docker is not available: $err" >&2; exit 1; fi
  echo "check:collector: skipped: Docker is not available ($err); the static CI shard runs it" >&2
  exit 0
fi
if ! docker image inspect "$img" >/dev/null 2>&1; then
  if ! err="$(docker pull "$img" 2>&1 >/dev/null)"; then
    if [ "$ci" = true ]; then echo "check:collector: could not pull $img: $err" >&2; exit 1; fi
    echo "check:collector: skipped: could not pull $img ($err)" >&2
    exit 0
  fi
fi

tmp="$(mktemp -d)"
pos="check-collector-$$-pos"
ctl="check-collector-$$-ctl"
agent="check-collector-$$-agent"
enabled="check-collector-$$-enabled"
traces="check-collector-$$-traces"
metrics="check-collector-$$-metrics"
both="check-collector-$$-both"
trap 'docker rm -f "$pos" "$ctl" "$agent" "$enabled" "$traces" "$metrics" "$both" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
trap 'exit 130' INT
trap 'exit 143' TERM

validate() { # $1: a directory holding the file, mounted read-only; $2: the container's name; $3: the file's name; the rest: more options for docker run
  dir="$1"; name="$2"; file="$3"; shift 3
  docker run --rm --name "$name" --pull never --network none "$@" \
    -v "$dir:/etc/otelcol:ro" \
    "$img" validate --config "/etc/otelcol/$file" "$gate"
}

# Positive: the shipped file validates (set -e stops the task otherwise).
mkdir "$tmp/ok"
cp "$cfg" "$tmp/ok/toposhift.yaml"
validate "$tmp/ok" "$pos" toposhift.yaml

# Positive: the optional node agent file validates too.
mkdir "$tmp/agent" "$tmp/sa"
cp deploy/otel-collector/nodeagent.yaml "$tmp/agent/nodeagent.yaml"
echo check-collector-token > "$tmp/sa/token"
: > "$tmp/sa/ca.crt"
# Its k8s_api detector is made at validation, and needs a node name and an in-cluster
# setting: a name, an address that is never dialled, and a service account directory
# with a token. The empty ca.crt is logged as unusable and does not fail the validation.
validate "$tmp/agent" "$agent" nodeagent.yaml \
  -e K8S_NODE_NAME=check-collector-node \
  -e KUBERNETES_SERVICE_HOST=127.0.0.1 -e KUBERNETES_SERVICE_PORT=6443 \
  -v "$tmp/sa:/var/run/secrets/kubernetes.io/serviceaccount:ro"

# Positive: the opt-in form of toposhift.yaml, with the node agents' receiver and its
# pipeline entry uncommented (the five lines that carry #NODEAGENTS), so that the
# step in the README cannot rot.
mkdir "$tmp/enabled"
sed 's/^#NODEAGENTS //' "$cfg" > "$tmp/enabled/toposhift.yaml"
n="$( { diff "$cfg" "$tmp/enabled/toposhift.yaml" || true; } | grep -c '^>' || true)"
if [ "$n" != 5 ]; then echo "check:collector: the opt-in form changed $n lines, not 5" >&2; exit 1; fi
validate "$tmp/enabled" "$enabled" toposhift.yaml

# Positive: the optional trace collector validates.
mkdir "$tmp/traces"
cp deploy/otel-collector/tracemetrics.yaml "$tmp/traces/tracemetrics.yaml"
validate "$tmp/traces" "$traces" tracemetrics.yaml

# Positive: the trace metrics opt-in form of toposhift.yaml (the 37 lines that carry
# #TRACEMETRICS uncommented), alone and together with the node agents' form.
mkdir "$tmp/metrics" "$tmp/both"
sed 's/^#TRACEMETRICS //' "$cfg" > "$tmp/metrics/toposhift.yaml"
n="$( { diff "$cfg" "$tmp/metrics/toposhift.yaml" || true; } | grep -c '^>' || true)"
if [ "$n" != 37 ]; then echo "check:collector: the trace metrics opt-in form changed $n lines, not 37" >&2; exit 1; fi
validate "$tmp/metrics" "$metrics" toposhift.yaml
sed -e 's/^#NODEAGENTS //' -e 's/^#TRACEMETRICS //' "$cfg" > "$tmp/both/toposhift.yaml"
validate "$tmp/both" "$both" toposhift.yaml

# Negative control: exactly one key misspelt.
n="$(grep -c '^ *num_consumers:' "$cfg" || true)"
if [ "$n" != 1 ]; then echo "check:collector: expected exactly one num_consumers: line in $cfg, found $n" >&2; exit 1; fi
mkdir "$tmp/bad"
sed 's/^\( *\)num_consumers:/\1num_consumer:/' "$cfg" > "$tmp/bad/toposhift.yaml"
n="$( { diff "$cfg" "$tmp/bad/toposhift.yaml" || true; } | grep -c '^>' || true)"
if [ "$n" != 1 ]; then echo "check:collector: the control changed $n lines, not 1" >&2; exit 1; fi
rc=0
out="$(validate "$tmp/bad" "$ctl" toposhift.yaml 2>&1)" || rc=$?
if [ "$rc" = 0 ]; then echo "check:collector: the misspelt control validated: the check cannot fail" >&2; exit 1; fi
if ! printf '%s\n' "$out" | grep -qw num_consumer; then
  echo "check:collector: the control failed for another reason (exit $rc):" >&2
  printf '%s\n' "$out" >&2
  exit 1
fi
echo "check:collector: ok (toposhift.yaml, its two opt-in forms alone and together, nodeagent.yaml and tracemetrics.yaml validate; the control is refused)"
'''

[tasks.spelling]
description = "Check spelling in code and docs"
run = "typos"

# The test tasks write a JSON report when TEST_REPORT_DIR is set (CI does, to show
# the slowest tests in the job summary); otherwise they only print.
# The race detector needs cgo on Linux, so test and test:deep cannot run with
# CGO_ENABLED=0 as test:fast:root does. The cgo-free build of everything is
# checked by purego, which is part of the static shard.
[tasks.test]
description = "Run tests with the race detector"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/test.json"} -- -race -timeout 15m ./...'

[tasks."test:deep"]
description = "Run every test with the race detector, in random order"
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/test-deep.json"} -- -race -shuffle=on -count=1 -timeout 45m ./...'

# The edit loop. check is the formatters, the linters and test:fast, which is both
# modules' tests without the race detector, the bench module in its invariant
# tier exactly as bench:test runs it. Neither is part of ci: run check between
# edits, ci before committing, and ci:deep for what a push to main runs.
#
# go test reuses a package's result unless its test binary or an input it
# records changed, so after an edit only the packages that edit reaches rerun. A
# change that leaves every binary the same (a comment that moves no line, a
# Markdown file) reruns nothing; a comment that adds or removes a line changes the
# line numbers compiled into its package and reruns the packages that import it.
[tasks.check]
description = "Formatting, lint and the tests without the race detector, reusing unchanged results"
depends = ["fmt:check", "lint", "bench:fmt:check", "bench:lint", "test:fast"]

# What the pre-push hook runs: the static checks that need no test binary, no
# network and no race detector, all of them also part of ci:static. It is not a
# shard and not part of ci, so check:ci-shards is unaffected.
[tasks."check:static"]
description = "Formatting, lint, spelling, the no-results check, the CI shard list and the secret scan, without tests"
depends = ["fmt:check", "lint", "bench:fmt:check", "bench:lint", "bench:postgres:fmt:check", "bench:victoria:fmt:check", "spelling", "check:no-results", "check:ci-shards", "secrets"]

[tasks."test:fast"]
description = "Both modules' tests without the race detector, the bench module with Pebble's invariant checks on"
depends = ["test:fast:root", "test:fast:bench"]

[tasks."test:fast:root"]
description = "The root module's tests without the race detector, cgo off"
hide = true
env = { CGO_ENABLED = "0" }
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/test-fast.json"} -- ./...'

# The same command, flags and environment as bench:test, so the two share results.
[tasks."test:fast:bench"]
description = "The bench module's full tests with Pebble's invariant checks on, cgo off"
hide = true
dir = "bench"
env = { CGO_ENABLED = "0", TOPOSHIFT_REQUIRE_INVARIANTS = "1", TOPOSHIFT_RAPID_CHECKS = "40" }
run = 'gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/bench-test-fast.json"} -- -tags invariants ./...'

[tasks.vuln]
description = "Scan dependencies for known vulnerabilities"
depends = ["warm"]
run = "go tool govulncheck ./..."

[tasks.secrets]
description = "Scan the working tree and history for secrets"
run = "gitleaks git --redact --verbose"

[tasks."check:replace"]
description = "Fail if go.mod has replace or exclude directives (go install @latest must work)"
run = '''
if [ "$(go mod edit -json | jq '((.Replace // []) | length) + ((.Exclude // []) | length)')" != "0" ]; then
  echo "go.mod must not contain replace or exclude directives" >&2
  exit 1
fi
'''

[tasks.build]
description = "Build the toposhift binary into ./bin, without cgo"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/toposhift ./cmd/toposhift"

# ci is exactly six shards, and CI runs each shard as its own job on both
# architectures, so the shards build and test side by side on separate runners
# instead of all of them sharing one. A job named ci (<runner>) passes only when
# every shard passed on both. check and test:fast are not shards and not part of
# ci. check:ci-shards fails if ci depends on anything but the shards, or if the
# workflow's list of shards differs from them, so a task added to ci directly,
# or a shard the workflow does not run, cannot pass locally and be missed by CI.
#
# The root module's race tests are two shards, raceheavy and racerest, because
# the few slowest packages under the race detector took as long as all the
# others together on a runner's four processors (about 15 min for the whole
# module on x86-64, about 8 for either half), and the bench module's trimmed
# race tier is two the same way (benchraceheavy, benchracerest: about 12 min
# whole on x86-64). internal/raceshards names each module's heavy packages and
# prints each half from go list ./...; the halves partition the module by
# construction, and a stale name fails the task (the guard that runs on every
# shard) and the command's own test, which stats each named directory. mise run
# test and bench:test:race are still the whole module in one go.
[tasks.ci]
description = "Everything CI runs on a pull request"
depends = ["ci:static", "ci:bench", "ci:raceheavy", "ci:racerest", "ci:benchraceheavy", "ci:benchracerest"]

[tasks."ci:static"]
description = "CI shard: formatting, lint, spelling, vulnerabilities, the Pebble pin and the cgo-free build, workflows, secrets and the collector configuration"
depends = ["fmt:check", "lint", "spelling", "check:replace", "check:pebble-pin", "purego", "check:ci-shards", "check:no-results", "bench:fmt:check", "bench:rocksdb:fmt:check", "bench:postgres:fmt:check", "bench:victoria:fmt:check", "bench:lint", "bench:postgres:lint", "bench:victoria:lint", "vuln", "bench:vuln", "bench:postgres:vuln", "bench:victoria:vuln", "lint:workflows", "secrets", "check:collector"]

[tasks."ci:bench"]
description = "CI shard: the bench module's full tests and its cgo-free build, and the Postgres and metrics-store modules'"
depends = ["bench:test", "bench:purego", "bench:postgres:test", "bench:postgres:purego", "bench:victoria:test", "bench:victoria:purego"]

[tasks."ci:raceheavy"]
description = "CI shard: the slowest packages of the root module under the race detector"
depends = ["test:race:heavy"]

[tasks."ci:racerest"]
description = "CI shard: the other packages of the root module under the race detector"
depends = ["test:race:rest"]

# The same flags as test, on one half of the packages each. The package list and
# the half are taken in assignments first (a pipeline into a substitution would
# hide a failing go list), so that a failure of either, such as a stale name in
# raceshards' heavy list, fails the task instead of leaving go test an empty list.
[tasks."test:race:heavy"]
description = "The slowest packages of the root module with the race detector (see internal/raceshards)"
hide = true
run = '''
set -eu
all="$(go list ./...)"
pkgs="$(printf '%s\n' "$all" | go run ./internal/raceshards heavy)"
# shellcheck disable=SC2086 # the list is one package a line
gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/test-raceheavy.json"} -- -race -timeout 15m $pkgs
'''

[tasks."test:race:rest"]
description = "The other packages of the root module with the race detector (see internal/raceshards)"
hide = true
run = '''
set -eu
all="$(go list ./...)"
pkgs="$(printf '%s\n' "$all" | go run ./internal/raceshards rest)"
# shellcheck disable=SC2086 # the list is one package a line
gotestsum --format standard-quiet ${TEST_REPORT_DIR:+--jsonfile "$TEST_REPORT_DIR/test-racerest.json"} -- -race -timeout 15m $pkgs
'''

[tasks."ci:benchraceheavy"]
description = "CI shard: the slowest packages of the bench module's trimmed tests under the race detector"
depends = ["bench:test:race:heavy"]

[tasks."ci:benchracerest"]
description = "CI shard: the other packages of the bench module's trimmed tests under the race detector, and the Postgres and metrics-store modules'"
depends = ["bench:test:race:rest", "bench:postgres:test:race", "bench:victoria:test:race"]

[tasks."check:no-results"]
description = "Fail if measurement output is tracked: numbers from a laptop or a VM are never published"
run = '''
set -eu
files="$(git ls-files -- bench/results ':(glob)bench/**/*.jsonl' ':(glob)bench/**/plan.json' ':(glob)bench/**/manifest.json' ':(glob)bench/**/results.json' ':(glob)bench/**/timings.json' ':(glob)bench/**/report.txt')"
found="$(printf '%s\n' "$files" | head -5)"
if [ -n "$found" ]; then
  echo "check:no-results: measurement output is tracked, remove it from the index:" >&2
  echo "$found" >&2
  exit 1
fi
'''

[tasks."check:ci-shards"]
description = "Fail if ci is not exactly the shards the CI workflow runs"
run = '''
set -eu
info="$(mise tasks info ci --json)"
mine="$(printf '%s\n' "$info" | jq -r '.depends[]' | sort)"
# The workflow lists its shards on one line, `shard: [a, b, c]`, as ci:a, ci:b, ci:c.
line="$(grep -E '^ +shard: \[[a-z, ]+\]$' .github/workflows/ci.yml || true)"
if [ "$(printf '%s\n' "$line" | grep -c .)" != 1 ]; then
  echo "check:ci-shards: expected exactly one 'shard: [...]' line in .github/workflows/ci.yml" >&2
  exit 1
fi
theirs="$(printf '%s\n' "$line" | sed -E 's/.*\[(.*)\]/\1/' | tr ',' '\n' | sed -E 's/^ *//; s/ *$//; s/^/ci:/' | sort)"
if [ -z "$mine" ] || [ "$mine" != "$theirs" ]; then
  echo "check:ci-shards: ci depends on [$(echo $mine)] but the workflow runs [$(echo $theirs)]" >&2
  exit 1
fi
'''

# What runs on every push to main and nightly: the whole of every test under the
# race detector, in random order and never reused from an earlier run, which a
# pull request only runs in part.
[tasks."ci:deep"]
description = "The full race-detector run of every test, in random order"
depends = ["test:deep", "bench:test:deep"]

[tasks.hooks]
description = "Install the git hooks"
run = "lefthook install"
