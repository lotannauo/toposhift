# OpenTelemetry collector (contrib 0.162.0) configuration that reads Kubernetes
# and sends it to toposhift. See README.md in this directory.
#
# Start the collector with the entity-events feature gate on, or the k8s_cluster
# receiver sends the wrong log shape:
#
#   otelcol-contrib --config toposhift.yaml \
#     --feature-gates=pkg.experimentalmetricmetadata.useEntityEventsSpecification
#
# Edit three things and nothing else:
#   <CLUSTER_NAME>    the processor below: a name for this cluster
#   <TOPOSHIFT_HOST>  the exporter below: where toposhift listens (and in the trace
#                     metrics exporter, if you enable that opt-in)
#   the storage directory, only if the default path is not writable
#
# The collector is the buffer. The settings below make it hold data durably while
# toposhift is down and send it in order when toposhift is back.

receivers:
  # Kubernetes objects. Each kind is read twice. Watch mode sends every change as
  # it happens. Pull mode lists the whole kind every 5 minutes, which repairs
  # whatever a dropped watch missed.
  k8s_objects:
    auth_type: serviceAccount
    objects:
      - name: pods
        mode: watch
      - name: nodes
        mode: watch
      - name: pods
        mode: pull
        interval: 5m
      - name: nodes
        mode: pull
        interval: 5m

  # Cluster entities (namespaces, deployments, and so on), sent as entity events
  # on the logs pipeline. With the 5 minute metadata interval the entity report
  # interval is 300 seconds. This needs the feature gate named at the top.
  k8s_cluster:
    auth_type: serviceAccount
    metadata_collection_interval: 5m

  # The node agents' port: OFF by default, and the opt-in step of README.md ("Node
  # agents"). Read that section first: enabling it opens an unauthenticated port in
  # the one pipeline, and anything that can reach it can send the records every
  # receiver here sends. To enable it, remove the prefix "#NODEAGENTS " (with its
  # space) from the lines that carry it: these four, and the one in the pipeline.
  #
#NODEAGENTS   otlp:
#NODEAGENTS     protocols:
#NODEAGENTS       http:
#NODEAGENTS         endpoint: 0.0.0.0:4318

  # The trace collector's port: OFF by default, and the opt-in step of README.md
  # ("Services and their calls"). Read that section first: enabling it opens an
  # unauthenticated port, and anything that can reach it can send metrics named like
  # the two it keeps. It feeds the metrics pipeline only, never the logs one. To
  # enable it, remove the prefix "#TRACEMETRICS " (with its space) from the lines
  # that carry it: 37 in all, in the receivers, the processors, the exporters and
  # the pipelines.
  #
#TRACEMETRICS   otlp/tracemetrics:
#TRACEMETRICS     protocols:
#TRACEMETRICS       http:
#TRACEMETRICS         endpoint: 0.0.0.0:4319

processors:
  # The name of this cluster. Set it once per cluster. It is at most 21 bytes of
  # the characters A-Z a-z 0-9 . _ : / and -. Delete this processor, and its entry
  # in the pipeline below, to send no name: toposhift then uses "default", or the
  # cluster name toposhift is configured with (--cluster-name). When toposhift is
  # configured with a name, this one must be the same; see README.md.
  resource:
    attributes:
      - key: k8s.cluster.name
        value: <CLUSTER_NAME>
        action: upsert

  # The trace metrics opt-in: only the two metrics the trace collector makes go on.
  # The resource processor above still sets the cluster name on them.
#TRACEMETRICS   filter/tracemetrics:
#TRACEMETRICS     error_mode: ignore
#TRACEMETRICS     metrics:
#TRACEMETRICS       metric:
#TRACEMETRICS         - 'name != "traces_service_graph_request_total" and name != "trace.span.count"'

exporters:
  otlphttp/toposhift:
    # Where toposhift listens. It listens on 127.0.0.1:7070 unless started with
    # TOPOSHIFT_LISTEN set to an address the cluster can reach.
    endpoint: http://<TOPOSHIFT_HOST>:7070
    encoding: proto
    compression: gzip
    timeout: 30s

    # Retry for as long as it takes. 429, 502, 503 and 504 are retried and the
    # server's Retry-After is honoured. Every other status is permanent and the
    # request is dropped. max_elapsed_time: 0 means never give up.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0

    sending_queue:
      enabled: true
      # Keep the queue on disk, so a collector restart does not lose it.
      storage: file_storage/toposhift
      # One consumer sends requests one at a time, in the order they were queued.
      num_consumers: 1
      # The queue is sized in bytes, so what an outage can hold does not depend on
      # how large the requests are. queue_size is the most the queue holds, about
      # 2 GB of queued data (an estimate: the size of the requests as the
      # collector counts it). That is about 125 maximum-size exports of 16 MB, and
      # many times the largest request a receiver emits. The disk it takes is up
      # to about twice this while the file compacts; see README.md. Raise or lower
      # queue_size to change it. When the queue is full the collector drops new
      # data (block_on_overflow stays off). A long outage can fill it.
      sizer: bytes
      queue_size: 2000000000
      # Each export is merged or split to at most 16 MB, by size in bytes whatever
      # the objects weigh, so it stays well under toposhift's limit of 64 MiB for a
      # decoded request body. This protects toposhift from a 413; queue_size above
      # is what bounds the queue's disk.
      batch:
        sizer: bytes
        max_size: 16000000
        flush_timeout: 1s

  # The trace metrics opt-in: its own exporter and its own queue on the same volume,
  # so that the queue's bound is stated here and the 2 GB above is not doubled. The
  # queue is smaller, because these metrics are small, and it keeps the same
  # order: one consumer.
#TRACEMETRICS   otlphttp/toposhift_metrics:
#TRACEMETRICS     endpoint: http://<TOPOSHIFT_HOST>:7070
#TRACEMETRICS     encoding: proto
#TRACEMETRICS     compression: gzip
#TRACEMETRICS     timeout: 30s
#TRACEMETRICS     retry_on_failure:
#TRACEMETRICS       enabled: true
#TRACEMETRICS       initial_interval: 5s
#TRACEMETRICS       max_interval: 30s
#TRACEMETRICS       max_elapsed_time: 0
#TRACEMETRICS     sending_queue:
#TRACEMETRICS       enabled: true
#TRACEMETRICS       storage: file_storage/toposhift
#TRACEMETRICS       num_consumers: 1
#TRACEMETRICS       sizer: bytes
#TRACEMETRICS       queue_size: 500000000
#TRACEMETRICS       batch:
#TRACEMETRICS         sizer: bytes
#TRACEMETRICS         max_size: 16000000
#TRACEMETRICS         flush_timeout: 1s

extensions:
  # Disk storage for the sending queue.
  file_storage/toposhift:
    # The collector's user must be able to write here.
    directory: /var/lib/otelcol/toposhift
    create_directory: true
    # Sync every write to disk, so the queue survives the host losing power. This
    # costs the collector some throughput.
    fsync: true
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol/toposhift

service:
  extensions:
    - file_storage/toposhift
  pipelines:
    logs:
      receivers:
        - k8s_objects
        - k8s_cluster
#NODEAGENTS         - otlp
      processors:
        - resource
      exporters:
        - otlphttp/toposhift
#TRACEMETRICS     metrics:
#TRACEMETRICS       receivers:
#TRACEMETRICS         - otlp/tracemetrics
#TRACEMETRICS       processors:
#TRACEMETRICS         - filter/tracemetrics
#TRACEMETRICS         - resource
#TRACEMETRICS       exporters:
#TRACEMETRICS         - otlphttp/toposhift_metrics
